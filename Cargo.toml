[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
sha2 = "0.10"
proptest = "1"

# Unchecked overflow must never silently wrap money, even in optimised builds.
[profile.release]
overflow-checks = true

[profile.bench]
overflow-checks = true
