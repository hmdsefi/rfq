[package]
name = "rfq-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# Off by default so `cargo test --workspace` never builds rusteron. Without it the binary only
# reports that it was built without Aeron and exits with status 2. The library, the WebSocket
# server and the hub loop build and test either way; docker/rust.Dockerfile enables it.
aeron = ["rfq-infra/aeron"]

[dependencies]
rfq-app = { path = "../rfq-app" }
rfq-domain = { path = "../rfq-domain" }
# The codec, always: the hub refuses a command whose encoding exceeds the node's ingress limit.
# With feature `aeron`, also the Aeron adapter's `aeron::{connect, offer, ...}` and `Reassembler`.
rfq-infra = { path = "../rfq-infra" }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
tungstenite = { workspace = true }

[dev-dependencies]
# The scripted scenarios and the well-known accounts, for the sealing test.
rfq-testkit = { path = "../rfq-testkit" }
