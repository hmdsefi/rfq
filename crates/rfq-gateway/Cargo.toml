[package]
name = "rfq-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# Off by default so `cargo test --workspace` never builds rusteron. The Aeron adapter and the
# WebSocket binary come with it (docs/specs/gateway.md §9); docker/rust.Dockerfile enables it.
aeron = []

[dependencies]
rfq-app = { path = "../rfq-app" }
rfq-domain = { path = "../rfq-domain" }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The scripted scenarios and the well-known accounts, for the sealing test.
rfq-testkit = { path = "../rfq-testkit" }
