[package]
name = "rfq-demo"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# Off by default so `cargo test --workspace` never builds rusteron. Without it the binary only
# reports that it was built without Aeron and exits with status 2. docker/rust.Dockerfile enables it.
aeron = ["rfq-infra/aeron"]

[dependencies]
rfq-app = { path = "../rfq-app" }
rfq-domain = { path = "../rfq-domain" }
rfq-infra = { path = "../rfq-infra" }
# The scripted scenarios and the well-known accounts.
rfq-testkit = { path = "../rfq-testkit" }
anyhow = { workspace = true }
tracing-subscriber = { workspace = true }
