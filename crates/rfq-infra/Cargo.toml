[package]
name = "rfq-infra"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# The Aeron transport and Archive journal. Off by default: building rusteron needs cmake >= 3.30,
# clang and a JDK (see docker/rust.Dockerfile), so plain `cargo test` never builds it.
aeron = ["dep:rusteron-archive"]

[dependencies]
rfq-app = { path = "../rfq-app" }
rfq-domain = { path = "../rfq-domain" }
serde = { workspace = true }
bincode = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
crc32fast = { workspace = true }
# Pinned: the API in docs/specs/transport-aeron.md was verified against exactly this version.
# No `precompile` feature: the v0.2.11 release has no prebuilt artifacts.
rusteron-archive = { version = "=0.2.11", features = ["static"], optional = true }

[dev-dependencies]
rfq-testkit = { path = "../rfq-testkit" }
tempfile = { workspace = true }
