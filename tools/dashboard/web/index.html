<!doctype html>
<html lang="en" data-view="admin">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RFQ Engine Console</title>
<style>
:root {
  --page: #eef1f5; --surface: #ffffff; --inset: #f6f8fb;
  --ink: #13213a; --ink-2: #44546c; --ink-3: #5d6b80;
  --line: #d5dce6; --line-2: #b7c2d1;
  --accent: #3446b8; --accent-ink: #ffffff; --accent-tint: #e7eafb;
  --free: #c9d3e0; --free-ink: #33435a;
  --reserved: #e9a73a; --reserved-ink: #8a4f00; --reserved-tint: #fdf1dc;
  --escrow: #3446b8; --escrow-ink: #2a3a9e; --escrow-tint: #e7eafb;
  --yes: #12784a; --yes-tint: #e3f4ec; --no: #b3261e; --no-tint: #fbe7e5;
  --ok: #12784a; --ok-tint: #e3f4ec; --bad: #b3261e; --bad-tint: #fbe7e5;
  --warn: #8a4f00; --warn-tint: #fdf1dc; --gone: #5d6b80; --gone-tint: #edf0f4;
  --new: #fff7d6; --focus: #3446b8;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --r: 6px; --r-lg: 10px;
}
:root[data-theme="dark"] {
  --page: #0b1220; --surface: #121b2c; --inset: #0f1726;
  --ink: #e5ecf6; --ink-2: #b4c1d4; --ink-3: #93a2b8;
  --line: #24324a; --line-2: #354764;
  --accent: #8fa0ff; --accent-ink: #0b1220; --accent-tint: #1d2752;
  --free: #3a4a63; --free-ink: #c9d3e0;
  --reserved: #f4b740; --reserved-ink: #f6c66a; --reserved-tint: #3a2a0c;
  --escrow: #8fa0ff; --escrow-ink: #aab7ff; --escrow-tint: #1d2752;
  --yes: #4cc38a; --yes-tint: #0f3324; --no: #f2877e; --no-tint: #3d1714;
  --ok: #4cc38a; --ok-tint: #0f3324; --bad: #f2877e; --bad-tint: #3d1714;
  --warn: #f6c66a; --warn-tint: #3a2a0c; --gone: #93a2b8; --gone-tint: #1a2436;
  --new: #2c2a14; --focus: #8fa0ff;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--ink); font: 400 14px/1.5 var(--sans); font-variant-numeric: tabular-nums; }
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
h2 { font-size: 15px; }
h3 { font-size: 14px; }
p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: var(--mono); font-size: 13px; }
.muted { color: var(--ink-3); }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Controls */
.btn { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--surface); cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--ink-3); }
.btn svg { width: 14px; height: 14px; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn-primary:hover { filter: brightness(1.08); border-color: var(--accent); }
.btn-quiet { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn-quiet:hover { background: var(--inset); border-color: var(--line); }
.btn-yes { color: var(--yes); }
.btn-no { color: var(--no); }
.btn-danger { color: var(--bad); }
.btn-sm { min-height: 28px; padding: 0 9px; font-size: 13px; }
.field { display: grid; gap: 3px; font-size: 13px; color: var(--ink-2); }
.field input, .field select { min-height: 32px; width: 100%; padding: 0 8px; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--surface); color: var(--ink); }
.field .unit { position: relative; }
.field .unit input { padding-right: 26px; }
.field .unit span { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); color: var(--ink-3); }
.field-error { color: var(--bad); font-size: 13px; }
.seg-ctl { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--r); overflow: hidden; }
.seg-ctl button { min-height: 30px; padding: 0 10px; border: 0; border-right: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.seg-ctl button:last-child { border-right: 0; }
.seg-ctl button[aria-pressed="true"] { background: var(--ink); color: var(--surface); font-weight: 600; }

/* Badges: text always carries the meaning; colour only groups it */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 12.5px; font-weight: 600; line-height: 20px; white-space: nowrap; }
.b-live { background: var(--accent-tint); color: var(--escrow-ink); }
.b-good { background: var(--ok-tint); color: var(--ok); }
.b-gone { background: var(--gone-tint); color: var(--gone); }
.b-bad { background: var(--bad-tint); color: var(--bad); }
.b-warn { background: var(--warn-tint); color: var(--warn); }
.b-gone::before { content: ""; width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid currentColor; }
.b-live::before, .b-good::before, .b-bad::before, .b-warn::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.aud { display: inline-block; padding: 0 6px; border: 1px solid var(--line-2); border-radius: 4px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.aud-acct { border-color: var(--escrow); color: var(--escrow-ink); }
.sealed { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-3); font-style: italic; }
.sealed svg { width: 12px; height: 12px; }

/* Money: free / reserved (hatched: held, can come back) / escrowed (solid: locked to the contract) */
.bar { display: flex; height: 14px; border-radius: 3px; overflow: hidden; background: var(--inset); outline: 1px solid var(--line); }
.seg { height: 100%; transition: width 320ms cubic-bezier(.2,.7,.2,1); }
.seg.free { background: var(--free); }
.seg.reserved { background: repeating-linear-gradient(135deg, var(--reserved) 0 4px, color-mix(in srgb, var(--reserved) 55%, var(--surface)) 4px 7px); }
.seg.escrowed { background: var(--escrow); }
.key { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; color: var(--ink-2); }
.key i { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
@media (prefers-reduced-motion: reduce) { .seg { transition: none; } }

/* Layout */
.app { display: grid; grid-template-columns: minmax(0, 1fr) 440px; grid-template-rows: auto 1fr; min-height: 100dvh; }
.topbar { grid-column: 1 / -1; position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: grid; line-height: 1.25; margin-right: 6px; }
.brand strong { font-size: 15px; }
.brand span { font-size: 12.5px; color: var(--ink-3); }
.group { display: flex; align-items: center; gap: 6px; }
.group-label { font-size: 13px; color: var(--ink-3); margin-right: 2px; }
.clock { font-size: 15px; font-weight: 600; min-width: 92px; }
.health { margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: 13px; }
.health dl { display: flex; gap: 12px; margin: 0; }
.health dt { color: var(--ink-3); display: inline; }
.health dd { display: inline; margin: 0 0 0 4px; font-weight: 600; }
.stage { padding: 16px 20px 40px; display: grid; gap: 16px; align-content: start; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.panel-body { padding: 14px 16px; }

/* Scenario strip */
.scenario { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 20px; padding: 12px 16px; }
.scenario-title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.scenario-title h2 { font-size: 16px; }
.scenario p { color: var(--ink-2); max-width: 75ch; }
.expect { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; border: 1px dashed var(--line-2); font-size: 12.5px; color: var(--ink-3); }
.chip.seen { border-style: solid; border-color: var(--ok); color: var(--ok); background: var(--ok-tint); }
.chip.seen::before { content: "✓"; font-weight: 700; }
.progress { text-align: right; font-size: 13px; color: var(--ink-2); }
.progress strong { color: var(--ink); }

/* Arena: the two sides of the trade around the contract */
.arena { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.side { display: grid; gap: 12px; }
.side-head { display: flex; align-items: baseline; justify-content: space-between; padding: 0 2px; }
.side-head h2 { font-size: 15px; }
.side-head span { font-size: 13px; color: var(--ink-3); }
.party { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 12px 14px; display: grid; gap: 10px; }
.requesters .party { border-left: 3px solid var(--yes); }
.makers .party { border-left: 3px solid var(--escrow); }
.party-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.party-head h3 { font-size: 15px; }
.party-head .meta { font-size: 12.5px; color: var(--ink-3); }
.balances { display: grid; gap: 5px; }
.balance-nums { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; }
.balance-nums b { font-weight: 600; }
.item { border: 1px solid var(--line); border-radius: var(--r); padding: 9px 10px; display: grid; gap: 7px; background: var(--inset); }
.item-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.item-head .id { font-weight: 600; }
.item-facts { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 13px; color: var(--ink-2); }
.item-facts b { color: var(--ink); font-weight: 600; }
.item-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: end; }
.form-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) auto; gap: 6px; align-items: end; }
.countdown { font-weight: 600; color: var(--warn); }
.empty { font-size: 13px; color: var(--ink-3); padding: 2px 0; }
.toast { font-size: 13px; padding: 6px 10px; border-radius: var(--r); background: var(--bad-tint); color: var(--bad); }
a.idlink, button.idlink { color: var(--accent); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px; background: none; border: 0; padding: 0; cursor: pointer; font-weight: 600; }

/* Contract: the subject, in the middle */
.contract { padding: 16px 18px; display: grid; gap: 14px 24px; }
.contract-main, .contract-side { display: grid; gap: 14px; min-width: 0; }
.contract-q { font-size: 21px; line-height: 1.3; font-weight: 600; letter-spacing: -0.015em; }
.contract-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 13px; color: var(--ink-2); }
.timeline { position: relative; height: 66px; margin: 4px 6px 0; }
.tl-track { position: absolute; left: 0; right: 0; top: 30px; height: 6px; border-radius: 3px; background: var(--inset); outline: 1px solid var(--line); }
.tl-trading { position: absolute; left: 0; top: 30px; height: 6px; border-radius: 3px 0 0 3px; background: var(--yes); opacity: .55; }
.tl-mark { position: absolute; top: 22px; width: 2px; height: 22px; background: var(--ink-2); }
.tl-mark span { position: absolute; top: 26px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 12.5px; color: var(--ink-2); }
.tl-mark.end span { left: auto; right: 0; transform: none; }
.tl-now { position: absolute; top: 0; width: 2px; height: 52px; background: var(--accent); }
.tl-now span { position: absolute; top: -2px; left: 6px; white-space: nowrap; font-size: 12.5px; font-weight: 600; color: var(--accent); }
.roles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.role { border: 1px solid var(--line); border-radius: var(--r); padding: 9px 10px; display: grid; gap: 7px; }
.role-name { font-size: 13px; color: var(--ink-2); }
.role .item-actions .btn { flex: 1; justify-content: center; }
.positions table { width: 100%; border-collapse: collapse; font-size: 13px; }
.positions th { text-align: left; font-weight: 600; color: var(--ink-3); padding: 4px 6px; border-bottom: 1px solid var(--line); }
.positions td { padding: 5px 6px; border-bottom: 1px solid var(--line); }

/* Ledger ribbon */
.ledger table { width: 100%; border-collapse: collapse; }
.ledger th { text-align: right; font-size: 13px; font-weight: 600; color: var(--ink-3); padding: 8px 12px; border-bottom: 1px solid var(--line); }
.ledger th:first-child, .ledger td:first-child { text-align: left; }
.ledger th.barcol { width: 34%; text-align: left; }
.ledger td { text-align: right; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.ledger td .who { font-weight: 600; }
.ledger td .role { display: block; border: 0; padding: 0; font-size: 12.5px; color: var(--ink-3); }
.ledger tr.changed td { background: color-mix(in srgb, var(--new) 70%, transparent); }
.delta { display: block; font-size: 12.5px; font-weight: 600; }
.delta.up { color: var(--ok); }
.delta.down { color: var(--bad); }
.ledger tfoot td { font-weight: 600; border-bottom: 0; }
.ledger-foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 16px; border-top: 1px solid var(--line); font-size: 13px; }
.check-ok { color: var(--ok); font-weight: 600; }

/* Trace sidebar */
.trace { position: sticky; top: 57px; height: calc(100dvh - 57px); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: var(--surface); border-left: 1px solid var(--line); }
.trace-head { padding: 12px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.trace-head-top { display: flex; justify-content: space-between; align-items: baseline; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.filters button { min-height: 26px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); font-size: 12.5px; cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.log { overflow-y: auto; }
.row { border-bottom: 1px solid var(--line); }
.row-head { display: grid; grid-template-columns: 34px 62px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; width: 100%; padding: 7px 16px; border: 0; background: none; text-align: left; cursor: pointer; font-size: 13px; }
.row-head:hover { background: var(--inset); }
.row .seq { font-weight: 600; color: var(--ink-3); }
.row .t { color: var(--ink-3); }
.row .what { overflow-wrap: anywhere; }
.row .what b { font-weight: 600; }
.row .count { font-size: 12px; color: var(--ink-3); }
.row.is-new { background: var(--new); }
.row.is-rejected .what { color: var(--bad); }
.row-events { list-style: none; margin: 0; padding: 0 16px 9px 120px; display: grid; gap: 5px; font-size: 13px; }
.row-events li { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.row-events .ev { font-weight: 600; }
.row-events .ev.rej { color: var(--bad); }
.inspector { border-top: 1px solid var(--line); padding: 12px 16px; display: grid; gap: 8px; max-height: 44%; overflow-y: auto; background: var(--inset); }
.inspector ol { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 13px; }

/* Deliverables */
.tabs { display: flex; flex-wrap: wrap; gap: 2px; padding: 0 10px; border-bottom: 1px solid var(--line); }
.tab { padding: 10px 12px; border: 0; border-bottom: 2px solid transparent; background: none; cursor: pointer; color: var(--ink-2); font-weight: 600; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab small { font-weight: 400; color: var(--ink-3); }
.tabpanel { padding: 14px 16px; }
.tabpanel[hidden] { display: none; }
.machines { display: grid; grid-template-columns: repeat(auto-fit, minmax(440px, 1fr)); gap: 14px; }
.machine { border: 1px solid var(--line); border-radius: var(--r); padding: 10px; }
.machine h3 { margin-bottom: 6px; display: flex; gap: 8px; align-items: baseline; }
.machine svg { width: 100%; height: auto; display: block; }
.caption { font-size: 13px; margin-top: 4px; }
.sm-node rect { fill: var(--surface); stroke: var(--line-2); stroke-width: 1.2; }
.sm-node text { fill: var(--ink); font: 600 13px var(--sans); }
.sm-node.is-current rect { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 2.5; }
.sm-node.is-terminal rect { stroke-dasharray: 3 2; }
.sm-edge { fill: none; stroke: var(--ink-3); stroke-width: 1.3; }
.sm-edge.is-last { stroke: var(--accent); stroke-width: 2.5; }
.sm-label { fill: var(--ink-2); font: 400 12px var(--sans); }
.sm-label.is-last { fill: var(--accent); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; font-size: 13px; color: var(--ink-2); }
.dtable { width: 100%; border-collapse: collapse; font-size: 13px; }
.dtable th { text-align: left; color: var(--ink-3); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.dtable td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.dtable td:first-child { font-weight: 600; white-space: nowrap; }
.dtable code { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
.steps3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.not-built { display: inline-flex; padding: 2px 8px; border-radius: 4px; border: 1px dashed var(--warn); color: var(--warn); font-size: 12.5px; font-weight: 600; }
.seam { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.seam .item { background: var(--surface); }
.seam ul { margin: 0; padding-left: 18px; display: grid; gap: 3px; font-size: 13px; color: var(--ink-2); }

/* View-as: what a non-admin viewer can't see is replaced by an explicit "sealed" marker */
[data-view="mm1"] .only-admin { display: none !important; }
[data-view="admin"] .only-mm1 { display: none !important; }

@media (max-width: 1720px) { .arena { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .arena .contract-col { grid-column: 1 / -1; order: -1; } .contract { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); align-items: start; } }
@media (max-width: 1100px) { .app { grid-template-columns: 1fr; } .trace { position: static; height: auto; border-left: 0; border-top: 1px solid var(--line); } .log { max-height: 60vh; } }
@media (max-width: 720px) { .arena { grid-template-columns: 1fr; } .form-row { grid-template-columns: 1fr 1fr; } .row-events { padding-left: 16px; } .health { margin-left: 0; } .steps3 { grid-template-columns: 1fr; } .ledger { overflow-x: auto; } }
</style>
<style>
/* Theme: with no explicit choice (no data-theme) the page follows the OS; light without a preference.
   The tokens are the verbatim block's :root[data-theme="dark"] values. */
:root[data-theme="dark"] { color-scheme: dark; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0b1220; --surface: #121b2c; --inset: #0f1726;
    --ink: #e5ecf6; --ink-2: #b4c1d4; --ink-3: #93a2b8;
    --line: #24324a; --line-2: #354764;
    --accent: #8fa0ff; --accent-ink: #0b1220; --accent-tint: #1d2752;
    --free: #3a4a63; --free-ink: #c9d3e0;
    --reserved: #f4b740; --reserved-ink: #f6c66a; --reserved-tint: #3a2a0c;
    --escrow: #8fa0ff; --escrow-ink: #aab7ff; --escrow-tint: #1d2752;
    --yes: #4cc38a; --yes-tint: #0f3324; --no: #f2877e; --no-tint: #3d1714;
    --ok: #4cc38a; --ok-tint: #0f3324; --bad: #f2877e; --bad-tint: #3d1714;
    --warn: #f6c66a; --warn-tint: #3a2a0c; --gone: #93a2b8; --gone-tint: #1a2436;
    --new: #2c2a14; --focus: #8fa0ff;
    color-scheme: dark;
  }
}
</style>
<style>
/* Page additions the static mockup never needed: a disabled control must look disabled. */
.btn:disabled, .seg-ctl button:disabled { opacity: .45; cursor: not-allowed; }
.btn:disabled:hover { border-color: var(--line-2); }
.btn-primary:disabled:hover { filter: none; border-color: var(--accent); }
/* The trace adds a nonce column (the mockup had none) under a quiet column header. */
.row-head, .log-cols { grid-template-columns: 34px 70px 34px minmax(0, 1fr) auto; }
.log-cols { position: sticky; top: 0; z-index: 1; display: grid; gap: 8px; padding: 5px 16px; background: var(--surface); border-bottom: 1px solid var(--line); font-size: 12px; color: var(--ink-3); }
.row .nonce { color: var(--ink-3); }
.row .nonce svg { width: 12px; height: 12px; vertical-align: -1px; }
.row-events { padding-left: 178px; }
.row-events li { display: block; }
.row-events li > * { margin-right: 6px; }

<script>/*__RECORDER_JS__*/</script>
<script>/*__GATEWAY_JS__*/</script>
<script>/*__SCENARIOS_JS__*/</script>
<script>/*__MODEL_JS__*/</script>
<script>
// Live mode (DESIGN §11): the page drives the real stack and shows what comes back.
//   page -> WebSocket -> rfq-gateway -> Aeron -> rfq-node -> Aeron -> rfq-gateway -> WebSocket -> page
// Every panel renders RfqModel.modelAt(recording, position): the recorded gateway frames, at the
// scrubber's position. The page never computes money (amounts are `balances` values or event fields;
// a delta is a display diff of two of them) and never fires a timer (the engine does).

const DEFAULT_GATEWAY = "ws://127.0.0.1:18080";
const PER_RUN = RfqRecorder.ACCOUNTS_PER_RUN;
/** The node's genesis roles, shared by every run. */
const GENESIS = { 1: "Operator", 2: "Arbiter", 3: "Treasury" };
/** Scenario accounts (`id % 100` of a run's account): display name and role. */
const SCENARIO_ACCOUNT = { 4: ["Oracle", "system"], 10: ["Alice", "requester"], 30: ["Carol", "requester"], 20: ["MM1", "market_maker"], 21: ["MM2", "market_maker"] };
/** View as: key, label, scenario account. */
const VIEWS = [["admin", "Admin", null], ["alice", "Alice", 10], ["carol", "Carol", 30], ["mm1", "MM1", 20], ["mm2", "MM2", 21]];
const VIEW_ACCOUNT = Object.fromEntries(VIEWS.filter(([, , id]) => id != null).map(([k, , id]) => [k, id]));
const viewLabel = (key) => VIEWS.find(([k]) => k === key)?.[1] ?? key;
const TRACE_ROWS = 400;
/** In an account view, what stands in for the driver's own record (verdicts, details, steps, timing). */
const ADMIN_ONLY = "Run results and timing are shown in the Admin view.";
/** "All batches" after many runs: the lanes, contracts and ledger show the newest this many. */
const LANE_CAP = 20, CONTRACT_CAP = 10, LEDGER_CAP = 60;
const RENDER_EVERY_MS = 120;
const MAX_N = 500;
const MAX_K = 16;

function gatewayUrl() {
  const q = new URLSearchParams(location.search).get("gateway");
  if (q == null) return { url: DEFAULT_GATEWAY };
  if (!/^wss?:\/\/\S+$/i.test(q)) return { url: DEFAULT_GATEWAY, error: `Ignored ?gateway=${q}: it must be a ws:// or wss:// URL. Using ${DEFAULT_GATEWAY}.` };
  return { url: q };
}
const { url: GATEWAY, error: URL_ERROR } = gatewayUrl();

// ---- The connection, the driver, the views --------------------------------------------------------

const gw = RfqGateway.connect(GATEWAY);
const page = {
  conn: "disconnected", // connected | reconnecting | disconnected
  everUp: false,
  lastSeq: null,
  lastBatch: null, // { time, t }: the newest batch's engine time and when it came, for the clock
  runs: [], // every run's result (the driver's), in start order
  runsById: new Map(),
  runsByT0: new Map(),
  set: null, // the run set in progress: { label, kind, total, k, started, runs, stopping, hidden }
  lastSet: null,
  errors: URL_ERROR ? [URL_ERROR] : [],
  view: "admin", // or a VIEWS key
  viewConn: null,
  viewOff: null,
  viewTarget: null, // the account the view connection's hello names
  viewRun: null, // the run that account belongs to
  viewRecs: new Map(), // view key -> recorder of what the gateway sent that view
  viewAccounts: new Map(), // account -> view key, for every hello sent
};
const driver = RfqScenarios.createDriver(gw, {
  onRunStart(run) {
    run.epoch = driver.recorder.epoch;
    page.runs.push(run);
    page.runsById.set(run.id, run);
    page.runsByT0.set(run.t0, run);
    page.set?.runs.push(run);
    if (page.view !== "admin") aimView(run);
    schedule();
  },
  onRunEnd: () => schedule(),
  onLog: () => schedule(),
  onStep: () => schedule(),
});
const rec = driver.recorder;

gw.on("conn", (c) => {
  page.conn = c.up ? "connected" : "reconnecting";
  if (c.up) page.everUp = true;
  schedule();
});
gw.on("status", (f) => {
  if (f.last_seq != null) page.lastSeq = f.last_seq;
  schedule();
});
gw.on("batch", (f) => {
  page.lastSeq = f.seq;
  page.lastBatch = { time: f.time, t: performance.now() };
  schedule();
});
gw.on("welcome", () => schedule());

/** Switches what the panels show: the driver's own (admin) recording, or a second connection's. */
function setView(key) {
  if (key === page.view) return;
  page.view = key;
  selected = null;
  if (key === "admin") {
    closeViewConn();
  } else {
    if (!page.viewRecs.has(key)) page.viewRecs.set(key, RfqRecorder.createRecorder());
    const newest = page.runs.at(-1);
    page.viewTarget = null;
    page.viewRun = null;
    if (newest) aimView(newest);
  }
  schedule();
}

/**
 * Points the view connection at the current view's account in `run` (each run has its own accounts):
 * a `hello` with that account. The second connection is opened on first use. What it receives from
 * then on is recorded under the view; earlier frames stay as they were recorded.
 */
function aimView(run) {
  const account = run.t0 * PER_RUN + VIEW_ACCOUNT[page.view];
  page.viewTarget = account;
  page.viewRun = run.id;
  page.viewAimedAt = Date.now();
  page.viewAccounts.set(account, page.view);
  if (!page.viewConn) {
    const conn = RfqGateway.connect(GATEWAY, { view: { account } });
    page.viewConn = conn;
    page.viewOff = RfqRecorder.attachViews(conn, (v) => (v === "admin" ? null : page.viewRecs.get(page.viewAccounts.get(v.account)) ?? null));
    conn.on("*", () => schedule());
    conn.on("conn", () => schedule());
  } else if (page.viewConn.connected) {
    page.viewConn.hello({ account }).catch((e) => addError(`View as ${viewLabel(page.view)}: ${e.message}`));
  }
  // Not connected: the connection's own reconnect sends the last view; set it for the next hello.
  else page.viewConn.hello({ account }).catch(() => {});
}

function closeViewConn() {
  page.viewOff?.();
  page.viewConn?.close();
  page.viewConn = null;
  page.viewOff = null;
  page.viewTarget = null;
  page.viewRun = null;
}

/**
 * Display names: the run-scoped account ids with their scenario names. An account view names only the
 * accounts this page said hello as for that view (what the participant knows of itself); the admin
 * view names the accounts of the driver's runs.
 */
function accountInfo(id) {
  if (GENESIS[id]) return { name: GENESIS[id], role: "system" };
  const who = SCENARIO_ACCOUNT[id % PER_RUN];
  if (!who) return undefined;
  const t0 = Math.floor(id / PER_RUN);
  const known = page.view === "admin" ? page.runsByT0.has(t0) : page.viewAccounts.get(id) === page.view;
  return known ? { name: `${who[0]} (run …${String(t0).slice(-4)})`, role: who[1] } : undefined;
}
const name = (id) => (id == null ? "?" : accountInfo(id)?.name ?? `#${id}`);

// ---- What the panels show: the recording, the position, the model ---------------------------------

/** Page-only state: never engine data. */
const ui = {
  sel: "follow", // "follow" (the newest run), "all", or a run id
  pos: null, // null: live (the newest batch); a number: pinned
  rows: new Map(), // trace row key -> expanded
  filter: "all",
  logPinned: true,
  tab: "d1",
  copied: null,
  lastRunKey: null,
};
let selected = null; // { kind, id } the presenter clicked; D1 lights it (else the run's own objects)
let V = null; // this render's { r, run, n, pos, M, T0 }

function selectedRun() {
  if (ui.sel === "all") return null;
  if (ui.sel === "follow") return page.runs.at(-1) ?? null;
  return page.runsById.get(ui.sel) ?? null;
}

/**
 * The part of a batch that belongs to `run`: its own events (the verdict's), its commands' rejections
 * (a retry's Duplicate too: shown, never counted), and the balances of its accounts. A batch can carry
 * other runs' events: timers of concurrent runs fire in the same apply. A Resume that came while the
 * run was going is kept too (with only the run's part of it).
 */
function runFilter(run) {
  const own = new Set(run.own.map((o) => `${o.seq}|${JSON.stringify(o.event)}`));
  const origins = new Set(run.commands.map((c) => `${c.actor}:${c.nonce}`));
  const seqs = new Set(run.batches);
  const lo = run.t0 * PER_RUN;
  const mine = (a) => (a >= lo && a < lo + PER_RUN) || GENESIS[a] != null;
  // A Resume (the engine restarted or stalled) is everyone's: it belongs to the runs active when it came.
  const during = (b) => b.kind === "Resume" && b.firstAt >= run.startedAt && (!run.done || b.firstAt <= run.startedAt + run.wall_ms);
  return (b) => {
    if (!seqs.has(b.seq) && !during(b)) return null;
    const fromRun = b.origin != null && origins.has(`${b.origin.actor}:${b.origin.nonce}`);
    const events = b.events.filter((e) => own.has(`${b.seq}|${JSON.stringify(e.event)}`) || (fromRun && RfqRecorder.eventName(e) === "CommandRejected"));
    return { ...b, events, balances: (b.balances ?? []).filter((x) => mine(x.account)) };
  };
}

function recordingNow() {
  if (page.view !== "admin") {
    // An account view is exactly what the gateway sent that participant: every frame its connection
    // recorded. No run filter: deciding which events are a run's takes the driver's (admin) record.
    // The page's own commands still join, but only through an origin the gateway forwarded to this view;
    // they are the current journal's (the view connection's epochs count from when it opened).
    const batches = page.viewRecs.get(page.view)?.allBatches() ?? [];
    return { batches, commandAt: (seq) => driver.commandAt(seq), viewer: { account: page.viewTarget }, accountInfo, run: null };
  }
  const run = selectedRun();
  let batches = rec.allBatches();
  if (run) {
    const f = runFilter(run);
    batches = batches.filter((b) => b.epoch === run.epoch).map(f).filter(Boolean);
  }
  return { batches, commandAt: driver.commandAt, viewer: "admin", accountInfo, run };
}

/** `list` grouped by `key(item)`, in order: one pass, so the lanes are linear in the recording. */
function groupBy(list, key) {
  const out = new Map();
  for (const item of list) {
    const k = key(item);
    if (!out.has(k)) out.set(k, []);
    out.get(k).push(item);
  }
  return out;
}

function computeView() {
  const r = recordingNow();
  const n = r.batches.length;
  const pos = ui.pos == null ? n - 1 : Math.max(0, Math.min(ui.pos, n - 1));
  const M = RfqModel.modelAt(r, n ? pos : -1);
  const idx = {
    requestById: new Map(M.requests.map((x) => [x.id, x])),
    requestsBy: groupBy(M.requests, (x) => x.requester),
    quotesBy: groupBy(M.quotes, (x) => x.mm),
    positionsByContract: groupBy(M.positions, (x) => x.contract),
    positionsByRequest: groupBy(M.positions, (x) => x.request),
    proposed: M.contracts.filter((c) => RfqModel.variant(c.state) === "Proposed"),
    // Open to quotes in this view: no event ended it, and its public deadline is still ahead of the engine time here.
    open: M.requests.filter((x) => RfqModel.variant(x.state) === "Open" && (M.now == null || M.now < x.response_deadline)),
  };
  return { r, run: r.run, n, pos: n ? pos : -1, M, idx, T0: r.run?.t0 ?? null };
}

// ---- Formatting (display only) --------------------------------------------------------------------

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const fmtUsd = (micro) => {
  const v = Math.abs(micro), sign = micro < 0 ? "−" : "";
  const dollars = Math.floor(v / 1e6), cents = Math.floor((v % 1e6) / 1e4);
  return `${sign}$${dollars.toLocaleString("en-US")}.${String(cents).padStart(2, "0")}${v % 1e4 ? "+" : ""}`;
};
const fmtPrice = (bps) => (bps / 10000).toFixed(4).replace(/0{1,2}$/, ""); // 6000 → "0.60"
const pad = (n, w = 2) => String(n).padStart(w, "0");
/** An engine timestamp as the local wall clock (engine time is the sequencer's wall-clock ms). */
const clockOf = (ms) => {
  const d = new Date(ms);
  return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}.${pad(d.getMilliseconds(), 3)}`;
};
/** Engine time relative to the selected run's t0 (its contract id), or the wall clock with no run. */
const fmtT = (ms) => (ms == null ? "—" : V?.T0 != null ? `t+${((ms - V.T0) / 1000).toFixed(3)} s` : clockOf(ms));
const qty = (n) => (n == null ? "?" : n.toLocaleString("en-US"));
const sideName = (s) => (s === "BuyYes" ? "YES" : s === "BuyNo" ? "NO" : "?");
const outcomeName = (o) => String(o).toUpperCase();
const secs = (ms) => `${(ms / 1000).toFixed(3)} s`;
const ms = (us) => (us == null ? "—" : (us / 1000).toFixed(2));
const variant = RfqModel.variant;
const icon = (id) => `<svg aria-hidden="true"><use href="#i-${id}"/></svg>`;
const sealedMark = (text) => `<span class="sealed">${icon("lock")}${esc(text)}</span>`;
const BADGE = {
  Open: "b-live", Active: "b-live", Presented: "b-live", Trading: "b-live", Closed: "b-live", Proposed: "b-live",
  Selected: "b-warn", Disputed: "b-warn",
  Filled: "b-good", Final: "b-good", PASS: "b-good",
  Lost: "b-gone", Released: "b-gone", Expired: "b-gone", Cancelled: "b-gone", Replaced: "b-gone", STOPPED: "b-gone",
  Rejected: "b-bad", FAIL: "b-bad",
};
const badge = (text, cls) => `<span class="badge ${cls ?? BADGE[text] ?? "b-gone"}">${esc(text)}</span>`;
const byIdDesc = (a, b) => b.id - a.id;
const disabledIf = (off, why) => (off ? ` disabled${why ? ` title="${esc(why)}"` : ""}` : "");
const isAdmin = () => page.view === "admin";
const verdictOf = (run) => (!run.done ? "running" : run.stopped ? "STOPPED" : run.pass ? "PASS" : "FAIL");
const runTag = (run) => `${run.id} · …${String(run.t0).slice(-4)}`;

/** An id that selects its object for the inspector and D1. `where` keeps the focus key unique. */
const idlink = (kind, id, text, where) =>
  `<button class="idlink" type="button" data-action="select" data-kind="${kind}" data-id="${id}" data-key="sel-${where}-${kind}-${id}">${esc(text)}</button>`;

// ---- Render ---------------------------------------------------------------------------------------

const root = document.documentElement;
const app = document.getElementById("app");
let dirty = true;
let lastRender = 0;
let timer = null;

/**
 * Coalesces renders: frames can come in bursts, and the driver's timers share this thread. A timer, not
 * requestAnimationFrame: a tab that paints no frames (hidden, or a background pane) must still keep its
 * DOM current, controls included.
 */
function schedule() {
  dirty = true;
  if (timer) return;
  const wait = Math.max(0, RENDER_EVERY_MS - (performance.now() - lastRender));
  timer = setTimeout(() => {
    timer = null;
    if (dirty) render();
  }, wait);
}

function render() {
  dirty = false;
  lastRender = performance.now();
  V = computeView();
  // A new run in view: the presenter's pick of an object belonged to the old one.
  const runKey = V.run?.id ?? "all";
  if (runKey !== ui.lastRunKey) {
    ui.lastRunKey = runKey;
    selected = null;
    ui.rows.clear();
  }
  const focus = rememberFocus();
  root.dataset.view = page.view;
  renderTopBar();
  renderBanners();
  renderScenario();
  renderTimeline();
  renderUsers();
  renderContract();
  renderMarketMakers();
  renderLedger();
  renderRuns();
  renderDrills();
  renderTrace();
  renderInspector();
  renderPanels();
  followLog();
  restoreFocus(focus);
  updateTitle();
}

/** Containers are rebuilt with innerHTML, so keep keyboard focus (and the caret) on the same control. */
function rememberFocus() {
  const el = document.activeElement;
  if (!el || el === document.body) return null;
  const key = el.id || el.dataset?.key;
  if (!key) return null;
  let range = null;
  try { if (typeof el.selectionStart === "number") range = [el.selectionStart, el.selectionEnd]; } catch { range = null; }
  return { el, key, range };
}
function restoreFocus(f) {
  if (!f || document.contains(f.el)) return;
  const el = document.getElementById(f.key) ?? [...document.querySelectorAll("[data-key]")].find((x) => x.dataset.key === f.key);
  if (!el || el.disabled) return;
  el.focus({ preventScroll: true });
  if (f.range && el.setSelectionRange) try { el.setSelectionRange(...f.range); } catch { /* not a text field */ }
}

/** Sets innerHTML only when it changed, so focus, selection and hover survive a re-render. */
function setHtml(el, html) {
  if (el.patched === html) return;
  el.innerHTML = html;
  el.patched = html;
}

// ---- Top bar: run controls, view as, status --------------------------------------------------------

function renderTopBar() {

    : gw.engine === "up" ? badge("engine up", "b-good") : badge("engine down", "b-bad");
  setHtml(document.getElementById("tb-status"), `<span class="conn" title="${esc(GATEWAY)}">${conn}${engine}</span>
    <dl>
      <div><dt>last seq</dt><dd class="num" id="tb-seq">${page.lastSeq ?? "—"}</dd></div>
      <div><dt>engine clock</dt><dd class="num clock" id="tb-clock" title="The last batch's engine time, ticking here between batches (display only)">—</dd></div>
    </dl>
    <button class="btn btn-quiet btn-sm" type="button" id="theme" data-action="theme">${icon("theme")}Theme</button>`);

/** The engine clock: the last batch's time, ticking locally between batches. Display only. */
function tickClock() {
  const el = document.getElementById("tb-clock");

  const text = b ? clockOf(b.time + (performance.now() - b.t)).slice(0, -2) : "—";

}
setInterval(tickClock, 100);

// ---- Banners: errors, the view-as note, a hidden tab during a run -------------------------------

function addError(msg) {
  page.errors.push(msg);
  schedule();
}

function renderBanners() {
  const out = [];
  if (page.conn !== "connected") {
    out.push(`<div class="banner banner-warn" role="status"><span><b>${page.everUp ? "Reconnecting" : "Disconnected"}</b>: no connection to the gateway at ${esc(GATEWAY)}. ${page.everUp ? "Retrying." : "Is the stack up? <code class=\"mono\">docker compose up -d aeron engine gateway</code>. Retrying."}</span></div>`);
  }
  if (page.set && (document.hidden || page.set.hidden)) {
    out.push(`<div class="banner banner-warn" role="alert"><span><b>Keep this tab in front during a run.</b> It was in the background while runs were going: browsers slow a hidden tab's timers, so steps go out late and a run can fail on timing.</span></div>`);
  }

    const label = viewLabel(page.view);
    out.push(page.viewTarget != null
      ? `<div class="banner banner-info" role="status"><span><b>From now on you see what the gateway sends ${esc(label)} (run …${esc(String(Math.floor(page.viewTarget / PER_RUN)).slice(-4))}, account ${esc(page.viewTarget)}).</b> A second connection asked for this view; earlier frames stay as they were recorded. Each new run moves it to that run's ${esc(label)}.</span><button class="btn btn-sm" type="button" data-action="view" data-view="admin">Back to Admin</button></div>`
      : `<div class="banner banner-info" role="status"><span><b>View as ${esc(label)} starts with the next run.</b> Each run has its own accounts, so the view connection says hello as that run's ${esc(label)} when it starts. From then on you see what the gateway sends ${esc(label)}.</span></div>`);

function updateTitle() {
  const t = page.set && document.hidden ? "Run in progress: keep this tab in front · RFQ Engine Console" : "RFQ Engine Console";
  if (document.title !== t) document.title = t;
}

// ---- Scenario strip ------------------------------------------------------------------------------

/** Which expected events have happened by the position, matched in order like the verdict. */
function seenExpect(expect, events) {
  const names = events.map((ev) => {
    const v = variant(ev.event);
    return v === "CommandRejected" ? [v, `${v}(${ev.event.CommandRejected.reason})`] : [v];
  });
  let from = 0;
  return expect.map((want) => {
    const at = names.findIndex((n, k) => k >= from && n.includes(want));
    if (at < 0) return false;
    from = at + 1;
    return true;
  });
}

function renderScenario() {
  const el = document.getElementById("scenario");
  if (!isAdmin()) return renderScenarioAsViewer(el);
  const run = V.run;
  const name = run?.name ?? document.getElementById("scenario-pick").value;
  const s = RfqScenarios.byName(name);
  if (!s) return setHtml(el, '<p class="muted">Pick a scenario.</p>');
  const v = run ? verdictOf(run) : null;
  const title = [
    `<h2>${esc(s.name)}</h2>`,
    badge(s.kind === "attack" ? "Attack" : "Brief scenario", "b-live"),
    run ? `<span class="muted" style="font-size:13px">${esc(runTag(run))}</span>` : "",
    v === "running" ? badge("Running", "b-live") : v ? badge(v) : "",
  ].join("");
  let progress;
  if (!run) progress = "<div>Not run yet</div><div>Press <strong>Run</strong>: the page acts as every participant through the gateway.</div>";
  else if (!run.done) progress = `<div>Step <strong>${run.step}</strong> of ${run.steps}</div><div>${run.commands.length} command${run.commands.length === 1 ? "" : "s"} answered</div>`;
  else progress = `<div>${v === "PASS" ? "Every expected event happened in order." : esc(run.detail ?? "")}</div><div>${run.commands.length} commands · ${(run.wall_ms / 1000).toFixed(1)} s</div>`;
  // The admin view lights the chips from the run's own events (the verdict's input) up to the position;
  // an account view from what that view received.
  const events = !run ? [] : isAdmin()
    ? run.own.filter((o) => V.M.trace.some((e) => e.seq === o.seq))
    : V.M.trace.flatMap((e) => e.events);
  const seen = seenExpect(s.expect, events);
  const chips = s.expect.map((x, i) => `<span class="chip${seen[i] ? " seen" : ""}">${esc(x)}${seen[i] ? '<span class="sr-only"> (seen)</span>' : ""}</span>`).join("");
  setHtml(el, `<div>
      <div class="scenario-title">${title}</div>
      ${isAdmin() ? `<p>${esc(s.summary)}</p>` : '<p class="muted">The script\'s narration names sealed prices and limits, so it is shown in the Admin view.</p>'}
    </div>
    <div class="progress">${progress}</div>
    <div class="expect" role="group" aria-label="Expected events, in order${isAdmin() ? "" : ", as this view saw them"}">${chips}</div>`);
}

/**
 * An account view's strip: the picked script's name and expectations, lit only by the frames this
 * view's connection received since its last hello. No driver-sourced data (verdict, detail, steps).
 */
function renderScenarioAsViewer(el) {
  const s = RfqScenarios.byName(document.getElementById("scenario-pick").value);
  if (!s) return setHtml(el, '<p class="muted">Pick a scenario.</p>');
  const since = page.viewAimedAt ?? Infinity;
  const events = V.r.batches.slice(0, V.pos + 1).filter((b) => b.firstAt >= since).flatMap((b) => b.events);
  const seen = seenExpect(s.expect, events);
  const chips = s.expect.map((x, i) => `<span class="chip${seen[i] ? " seen" : ""}">${esc(x)}${seen[i] ? '<span class="sr-only"> (seen)</span>' : ""}</span>`).join("");
  setHtml(el, `<div>
      <div class="scenario-title"><h2>${esc(s.name)}</h2>${badge(s.kind === "attack" ? "Attack" : "Brief scenario", "b-live")}</div>
      <p class="muted">The script's narration names sealed prices and limits, so it is shown in the Admin view.</p>
    </div>
    <div class="progress"><div>${esc(ADMIN_ONLY)}</div></div>
    <div class="expect" role="group" aria-label="Expected events, in order, as this view received them since its hello">${chips}</div>`);
}

// ---- Timeline: the scrubber -----------------------------------------------------------------------

function renderTimeline() {
  const el = document.getElementById("timeline");

        <button class="btn btn-sm" type="button" id="tl-live" data-action="live" title="Follow the newest batch">${icon("live")}Live</button>
      </div>

  }

    : [`<option value="follow">Follow the newest run</option>`, `<option value="all">All batches</option>`,
      ...page.runs.slice().reverse().slice(0, 200).map((r) => `<option value="${esc(r.id)}">${esc(`${runTag(r)} ${r.name}${r.done ? ` · ${verdictOf(r)}` : " · running"}`)}</option>`)].join("");
  if (document.activeElement !== sel) {
    if (sel.patched !== options) {

    }

  const prev = document.getElementById("tl-prev"), next = document.getElementById("tl-next");

  const scope = !isAdmin() ? `every batch the gateway sent ${esc(viewLabel(page.view))}`
    : V.run ? `the batches of ${esc(runTag(V.run))} ${esc(V.run.name)}` : "every batch recorded";
  setHtml(document.getElementById("tl-label"), `${what}<span class="muted">Over ${scope}. Every panel shows the state at this batch. ←/→ step.</span>`);
}

// ---- Shared card parts ----------------------------------------------------------------------------

function partyHead(a) {
  // The model's one-pass map: the last nonce this view saw consumed (Duplicate and NonceGap consume nothing).
  const n = V.M.nonces.get(a.id);
  return `<div class="party-head"><h3>${esc(a.name)}</h3><span class="meta">account ${a.id}${n != null ? `, nonce ${n}` : ""}</span></div>`;
}

/** The free / reserved / escrowed split as a bar. Widths are layout only. */
function splitBar(balance) {
  const { free, reserved, escrowed } = balance;
  const total = free + reserved + escrowed; // layout only: the share each bucket takes of the bar
  const segs = [["free", free], ["reserved", reserved], ["escrowed", escrowed]]
    .filter(([, v]) => v > 0)
    .map(([k, v]) => `<div class="seg ${k}" style="width:${((v / total) * 100).toFixed(2)}%"></div>`).join("");
  return `<div class="bar" role="img" aria-label="Free ${fmtUsd(free)}, reserved ${fmtUsd(reserved)}, escrowed ${fmtUsd(escrowed)}">${segs}</div>`;
}

function balancesHtml(a) {
  const { free, reserved, escrowed } = a.balance;
  return `<div class="balances">
      ${splitBar(a.balance)}
      <div class="balance-nums"><span>Free <b>${fmtUsd(free)}</b></span><span>Reserved <b>${fmtUsd(reserved)}</b></span><span>Escrowed <b>${fmtUsd(escrowed)}</b></span></div>
    </div>`;
}

/** A rejection at the current position, shown in the acting card (and as a red row in the trace). */
function toastFor(actor) {
  const e = V.M.trace.at(-1);
  if (actor == null || !e || e.actor !== actor) return "";
  return e.events.filter((ev) => ev.event?.CommandRejected).map((ev) => {
    const a = e.command?.User?.action;
    const kind = a ? variant(a) : "command";
    const args = a ? Object.values(a)[0] : null;
    const field = ["quote", "request", "contract"].find((f) => args?.[f] != null);
    return `<p class="toast" role="status">Rejected: ${esc(ev.event.CommandRejected.reason)} (${esc(kind)}${field ? `, ${field} #${esc(args[field])}` : ""})</p>`;
  }).join("");
}

const LIVE_QUOTE = ["Active", "Selected"];
const LIVE_REQUEST = ["Open", "Presented"];

/** The newest `cap` of `list` (highest id first: a later run's accounts and objects have higher ids), and a note for the rest. */
function newest(list, cap, what) {
  if (list.length <= cap) return { shown: list, more: "" };
  const shown = [...list].sort((a, b) => b.id - a.id).slice(0, cap);
  // Only the admin view has a run picker in the timeline.
  const how = isAdmin() ? ": pick one run in the timeline to see them" : "";
  return { shown, more: `<p class="empty">… and ${list.length - cap} more ${what}${how}.</p>` };
}

// ---- Requesters lane ------------------------------------------------------------------------------

function renderUsers() {
  const el = document.getElementById("user-lane");
  const { shown: mine, more } = newest(V.M.accounts.filter((a) => a.role === "requester"), LANE_CAP, "requesters");
  const empty = isAdmin()
    ? "No requester has money yet: each run's setup funds its Alice and Carol."
    : `As ${esc(viewLabel(page.view))} you don't see who asks or their limits: the gateway sends each account only its own.${["alice", "carol"].includes(page.view) ? " Your card appears once your account's balance arrives." : " Open requests appear in your card."}`;
  const body = mine.length ? mine.map(requesterCard).join("") + more : `<article class="party"><p class="empty">${empty}</p></article>`;
  setHtml(el, `<div class="side-head"><h2 id="req-h">Requesters</h2><span>ask for a price</span></div>${body}`);
}

function requesterCard(a) {
  const theirs = [...(V.idx.requestsBy.get(a.id) ?? [])].sort(byIdDesc);
  const live = theirs.filter((r) => LIVE_REQUEST.includes(variant(r.state)));
  const ended = theirs.filter((r) => !LIVE_REQUEST.includes(variant(r.state)));
  // A run's requester can dispute its own run's contract (an account's t0 is its run's contract id).
  const proposed = V.idx.proposed.filter((c) => c.id === Math.floor(a.id / PER_RUN));
  const items = [...proposed.map((c) => disputeItem(a, c)), ...live.map((r) => requestItem(a, r)), ...ended.map((r) => requestItem(a, r))].join("");
  return `<article class="party" aria-label="${esc(a.name)}">
      ${partyHead(a)}
      ${balancesHtml(a)}
      ${items || '<p class="empty">No requests yet.</p>'}
      ${toastFor(a.id)}
    </article>`;
}

function requestItem(a, r) {
  const st = variant(r.state), leg = r.legs[0] ?? {}, where = `u${a.id}`;
  const head = [idlink("request", r.id, `Request #${r.id}`, where), badge(st)];
  if (st === "Rejected") head.push(`<span class="muted" style="font-size:13px">cause: ${esc(r.state.Rejected)}</span>`);
  const facts = [`<span>Buy <b>${sideName(leg.side)}</b> × <b>${esc(qty(leg.qty))}</b></span>`];
  facts.push(leg.limit_price != null ? `<span>Limit <b>${fmtPrice(leg.limit_price)}</b></span>` : sealedMark("limit sealed"));
  if (leg.contract != null) facts.push(`<span>${idlink("contract", leg.contract, `Contract #${leg.contract}`, `${where}r${r.id}`)}</span>`);
  const rows = [`<div class="item-facts">${facts.join("")}</div>`];
  if (st === "Open") {
    rows.push(`<div class="item-facts"><span>Quotes due <span class="countdown">${esc(fmtT(r.response_deadline))}</span></span></div>`);
  } else if (st === "Presented") {
    const acceptBy = r.state.Presented.accept_by;
    const picks = r.picks.map((k) => `<span>Best quote ${idlink("quote", k.quote, `#${k.quote}`, `${where}r${r.id}`)} at <b>${fmtPrice(k.price)}</b></span>`).join("");
    rows.push(`<div class="item-facts">${picks}<span>Accept by <span class="countdown">${esc(fmtT(acceptBy))}</span></span></div>`);
  } else if (st === "Filled") {
    for (const p of V.idx.positionsByRequest.get(r.id) ?? []) {
      rows.push(`<div class="item-facts"><span>Position #${p.id}</span><span>${p.settled ? "Settled" : "Escrowed (see the ledger)"}</span></div>`);
    }
  }
  return `<div class="item"><div class="item-head">${head.join("")}</div>${rows.join("")}</div>`;
}

function disputeItem(a, c) {
  const { outcome, dispute_until } = c.state.Proposed;
  return `<div class="item">
      <div class="item-head">${idlink("contract", c.id, `Contract #${c.id}`, `u${a.id}d`)}${badge("Proposed")}<span class="muted" style="font-size:13px">oracle says ${esc(outcomeName(outcome))}</span></div>

function makerCard(a) {
  const quotes = [...(V.idx.quotesBy.get(a.id) ?? [])].sort(byIdDesc);
  const live = quotes.filter((q) => LIVE_QUOTE.includes(q.state));
  const ended = quotes.filter((q) => !LIVE_QUOTE.includes(q.state));
  const quoted = new Set(live.map((q) => q.request));
  const open = V.idx.open.filter((r) => r.requester !== a.id && !quoted.has(r.id))
    .sort((x, y) => x.response_deadline - y.response_deadline || x.id - y.id);
  const items = [...live.map((q) => quoteItem(a, q)), ...open.map((r) => openRequestItem(a, r)), ...ended.map((q) => quoteItem(a, q))].join("");
  return `<article class="party" aria-label="${esc(a.name)}">

      ${items || '<p class="empty">No open requests to quote on.</p>'}
      ${toastFor(a.id)}
    </article>`;
}

/** An open request as every MM sees it: contract, side, qty and deadline. Never the limit, even as admin. */
function openRequestItem(a, r) {
  const leg = r.legs[0] ?? {}, where = `m${a.id}`;
  return `<div class="item">
      <div class="item-head">${idlink("request", r.id, `Request #${r.id}`, where)}${badge("Open")}<span class="muted" style="font-size:13px">quotes due ${esc(fmtT(r.response_deadline))}</span></div>
      <div class="item-facts"><span>Buy <b>${sideName(leg.side)}</b> × <b>${esc(qty(leg.qty))}</b></span>${leg.contract != null ? `<span>${idlink("contract", leg.contract, `Contract #${leg.contract}`, `${where}r${r.id}`)}</span>` : ""}${sealedMark("limit sealed")}</div>
    </div>`;
}

function quoteItem(a, q) {
  const where = `m${a.id}`;
  const leg = V.idx.requestById.get(q.request)?.legs[q.leg ?? 0];
  const facts = [`<span>Sell ${leg ? sideName(leg.side) : ""} at <b>${fmtPrice(q.price)}</b> × <b>${esc(qty(q.size))}</b></span>`];
  if (LIVE_QUOTE.includes(q.state)) facts.push(`<span>${q.state === "Selected" ? "Firm until" : "Expires"} ${esc(fmtT(q.expires_at))}</span>`);
  else if (q.state === "Filled") {
    const p = (V.idx.positionsByRequest.get(q.request) ?? []).find((x) => x.yes_holder === a.id || x.no_holder === a.id);
    facts.push(p ? `<span>Position #${p.id}</span><span>${p.settled ? "Settled" : "Escrowed (see the ledger)"}</span>` : "<span>Hold moved to escrow</span>");
  } else facts.push("<span>Hold released</span>");
  return `<div class="item">
      <div class="item-head">${idlink("quote", q.id, `Quote #${q.id}`, where)}${badge(q.state)}<span class="muted" style="font-size:13px">on request ${idlink("request", q.request, `#${q.request}`, `${where}q${q.id}`)}</span></div>
      <div class="item-facts">${facts.join("")}</div>
    </div>`;
}

// ---- Contract card --------------------------------------------------------------------------------

function renderContract() {
  const el = document.getElementById("contract");
  const { shown, more } = newest(V.M.contracts, CONTRACT_CAP, "contracts");

}

function timeline(c) {
  if (c.trading_close == null || c.resolution_deadline == null) return "";
  const base = c.id; // a run's contract id is its t0
  const now = V.M.now ?? base;
  const span = Math.max(1, c.resolution_deadline - base);
  const rel = (t) => `t+${((t - base) / 1000).toFixed(3)} s`;
  // Layout only: where each engine timestamp sits between t+0 and the hard deadline.
  const at = (t) => Math.min(100, Math.max(0, ((t - base) / span) * 100));
  const pct = (t) => `${at(t).toFixed(2)}%`;
  const p = c.proposal;
  const parts = ['<div class="tl-track"></div>', `<div class="tl-trading" style="width:${pct(c.trading_close)}"></div>`];
  if (p) parts.push(`<div class="tl-trading" style="left:${pct(p.at)};width:${(at(p.until) - at(p.at)).toFixed(2)}%;background:var(--warn);border-radius:0" title="Dispute window: proposed ${rel(p.at)}, open until ${rel(p.until)}"></div>`);
  const flip = at(now) > 70 ? ' style="left:auto;right:6px"' : "";
  parts.push(`<div class="tl-now" style="left:${pct(now)}"><span${flip}>now ${rel(now)}</span></div>`);
  parts.push(`<div class="tl-mark" style="left:${pct(c.trading_close)}"><span>trading closes ${rel(c.trading_close)}</span></div>`);
  if (p) {
    parts.push(`<div class="tl-mark" style="left:${pct(p.at)};height:14px;top:26px;opacity:.7" title="Proposed ${rel(p.at)}"></div>`);
    parts.push(`<div class="tl-mark" style="left:${pct(p.until)}" title="Dispute window ends ${rel(p.until)}"></div>`);
  }
  parts.push(`<div class="tl-mark end" style="left:calc(100% - 2px)"><span>hard deadline ${rel(c.resolution_deadline)}</span></div>`);
  const label = [`Now ${rel(now)}.`, `Trading closes ${rel(c.trading_close)}.`];
  // Plain text: the whole label is escaped where it is used.
  if (p) label.push(`Proposed ${outcomeName(p.outcome)} at ${rel(p.at)}, dispute window until ${rel(p.until)}.`);
  label.push(`Hard deadline ${rel(c.resolution_deadline)}.`);
  return `<div class="timeline" role="img" aria-label="${esc(label.join(" "))}">${parts.join("")}</div>`;
}

function contractCard(c) {
  const st = variant(c.state);
  const meta = [badge(st), idlink("contract", c.id, `Contract #${c.id}`, "cc")];
  if (c.oracle != null) meta.push(`<span>Oracle: ${esc(name(c.oracle))}</span>`);
  if (st === "Proposed") meta.push(`<span>Proposed <b>${esc(outcomeName(c.state.Proposed.outcome))}</b>, dispute until ${esc(fmtT(c.state.Proposed.dispute_until))}</span>`);
  if (st === "Disputed") meta.push(`<span>Proposed <b>${esc(outcomeName(c.state.Disputed.proposed))}</b>, disputed by ${esc(name(c.dispute?.disputer))}</span>`);
  if (st === "Final") meta.push(`<span>Outcome <b>${esc(outcomeName(c.state.Final))}</b>${c.ruling ? ` (ruled by the arbiter, bond ${c.ruling.bond_returned ? "returned" : "forfeited"})` : ""}</span>`);
  const known = c.description != null;
  const why = isAdmin()
    ? `${sealedMark("terms unknown")} Another client listed it (or this page wasn't connected yet): its question, oracle and deadlines travel in that listing command, which this page didn't send.`
    : `${sealedMark("terms not sent to this view")} The question, oracle and deadlines travel in the operator's listing command, whose origin the gateway forwards to the operator only.`;
  const terms = known
    ? `<h2 class="contract-q" id="contract-q-${c.id}">${esc(c.description)}</h2>`
    : `<h2 class="contract-q" id="contract-q-${c.id}">Contract #${esc(c.id)}</h2><p class="muted" style="font-size:13px">${why}</p>`;
  const windowS = c.dispute_window != null ? (c.dispute_window / 1000).toLocaleString("en-US", { maximumFractionDigits: 3 }) : null;
  return `<article class="panel contract">
      <div class="contract-main">
        <div>
          <div class="contract-meta" style="margin-bottom:6px">${meta.join("")}</div>
          ${terms}
        </div>
        ${timeline(c)}
        ${known ? `<p class="muted" style="font-size:13px">After close the oracle proposes; anyone can dispute for ${windowS} s with a bond. If the oracle never proposes by the hard deadline, it ends INVALID and each side gets its lock back. The scenario script plays the oracle, the disputer and the arbiter.</p>` : ""}
      </div>
      <div class="contract-side">
        ${toastFor(c.oracle)}
        <div class="positions">
          <h3 style="margin-bottom:6px">Positions</h3>
          ${positionsTable(c)}
        </div>
      </div>
    </article>`;
}

function positionsTable(c) {
  const list = V.idx.positionsByContract.get(c.id) ?? [];
  if (!list.length) {
    return isAdmin() ? '<p class="empty">No positions yet. One opens when a requester accepts a quote.</p>'
      : '<p class="empty">You hold no positions in this contract. Other parties\' fills stay private.</p>';
  }
  const line = (text) => `<span class="muted" style="display:block">${text}</span>`;
  // Payouts are PositionSettled's fields; the engine names both holders only there.
  const holder = (id, paid) => (id == null ? sealedMark("counterparty sealed until settlement") : `<b>${esc(name(id))}</b>`)
    + (paid != null ? line(`paid ${fmtUsd(paid)}`) : "");
  const rows = list.map((p) => `<tr style="vertical-align:top">
      <td><b>#${p.id}</b>${line(`${esc(qty(p.qty))} shares`)}${p.settled ? badge("Settled", "b-good") : badge("Escrowed", "b-live")}</td>
      <td>${holder(p.yes_holder, p.yes_payout)}</td>
      <td>${holder(p.no_holder, p.no_payout)}</td>
    </tr>`).join("");
  return `<div style="overflow-x:auto"><table>
      <thead><tr><th scope="col">Position</th><th scope="col">YES side</th><th scope="col">NO side</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
}

// ---- Ledger ---------------------------------------------------------------------------------------

const LEDGER_ORDER = ["requester", "market_maker"];
const roleText = (role) => (role === "market_maker" ? "market maker" : role);

/** A cell's change against the previous position: a display diff of two `balances` values. */
function deltaHtml(now, before) {
  if (before == null || now === before) return "";
  const d = now - before;
  return `<span class="delta ${d > 0 ? "up" : "down"}">${d > 0 ? "+" : ""}${fmtUsd(d)}</span>`;
}

function renderLedger() {
  const prev = V.M.previous;
  const rank = (a) => { const i = LEDGER_ORDER.indexOf(a.role); return i < 0 ? LEDGER_ORDER.length : i; };
  const { shown, more } = newest(V.M.accounts, LEDGER_CAP, "accounts");
  const sorted = [...shown].sort((a, b) => rank(a) - rank(b) || a.id - b.id);
  const rows = sorted.map((a) => {
    const b = a.balance, was = prev.get(a.id);
    const cells = [[b.free, was?.free], [b.reserved, was?.reserved], [b.escrowed, was?.escrowed]];
    const changed = !was || cells.some(([now, before]) => now !== before);
    const fresh = V.M.trace.at(-1)?.balances.some((x) => x.account === a.id);
    return `<tr${changed && fresh ? ' class="changed"' : ""}>
        <td><span class="who">${esc(a.name)}</span><span class="role">${esc(roleText(a.role))} · account ${a.id}</span></td>
        ${cells.map(([now, before]) => `<td>${fmtUsd(now)}${deltaHtml(now, before)}</td>`).join("")}
        <td>${b.free + b.reserved + b.escrowed > 0 ? splitBar(b) : ""}</td>
      </tr>`;
  }).join("");
  setHtml(document.getElementById("ledger-table"), rows ? `<table>
      <thead><tr><th scope="col">Account</th><th scope="col">Free</th><th scope="col">Reserved</th><th scope="col">Escrowed</th><th scope="col" class="barcol">Split</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>${more ? `<div style="padding:0 16px">${more}</div>` : ""}` : '<p class="empty" style="padding:12px 16px">No balances in these batches yet.</p>');
  const note = isAdmin()
    ? "Every amount is a `balances` value the engine sent with a batch; deltas are against the previous position. The page adds nothing up."
    : `Only ${esc(viewLabel(page.view))}'s own account: the gateway sends each account only its own balances.`;
  const el = document.getElementById("ledger-note");
  if (el.textContent !== note) el.textContent = note;
}

function renderRuns() {
  if (!isAdmin()) {
    // The driver's record (verdicts, details naming every participant's steps, timing) is the admin's.
    setHtml(document.getElementById("run-progress"), "");
    setHtml(document.getElementById("runs-table"), `<p class="runs-empty">${esc(ADMIN_ONLY)}</p>`);
    const log = document.getElementById("runlog");
    if (log.patched !== "") {
      log.innerHTML = "";
      log.patched = "";
    }
    log.hidden = true;
    return;
  }
  document.getElementById("runlog").hidden = false;
  const set = page.set;
  const active = driver.active;
  const prog = [];
  if (set) {
    const done = set.runs.filter((r) => r.done);
    prog.push(`<span><b>${esc(set.label)}</b>: ${done.length} of ${set.total} done, ${done.filter((r) => r.pass).length} passed${set.stopping ? " · stopping" : ""}</span>`);
    if (!set.runs.length && gw.engine !== "up") prog.push("<span>waiting for the engine to be up…</span>");
    for (const r of active.slice(0, 4)) prog.push(`<span>${esc(r.name)}: step <b>${r.step}</b> of ${r.steps}</span>`);
    if (active.length > 4) prog.push(`<span>+${active.length - 4} more running</span>`);
    prog.push(`<button class="btn btn-sm btn-danger" type="button" id="run-stop-2" data-action="stop"${disabledIf(set.stopping)}>${icon("stop")}Stop</button>`);
  } else if (page.lastSet) {
    const s = page.lastSet;
    prog.push(`<span>Last: <b>${esc(s.label)}</b>, ${s.runs.filter((r) => r.pass).length} of ${s.total} passed${s.stopped ? " (stopped)" : ""} in ${((s.finished - s.started) / 1000).toFixed(1)} s${s.hidden ? " · the tab was in the background during it, so its timing may have slipped" : ""}</span>`);
  } else prog.push('<span class="muted">Nothing run yet.</span>');
  setHtml(document.getElementById("run-progress"), prog.join(""));

  const current = V.run?.id;
  const shown = page.runs.slice().reverse().slice(0, 40);
  const rows = shown.map((r) => {
    const v = verdictOf(r);
    const p = r.perf?.latency_us ?? RfqRecorder.summarize(r.commands.filter((c) => !c.recovered).map((c) => c.latency_us));
    const detail = v === "PASS" ? "" : v === "running" ? `step ${r.step} of ${r.steps}` : esc(r.detail ?? "");
    const rec = r.recoveries.length ? `<br><span class="muted">${r.recoveries.map((x) => esc(`${x.step}: ${x.outcome}`)).join("<br>")}</span>` : "";
    return `<tr${r.id === current ? ' class="is-current"' : ""}>
        <td><button class="idlink" type="button" data-action="pick-run" data-run="${esc(r.id)}" data-key="pick-${esc(r.id)}">${esc(runTag(r))}<span class="sr-only">, show in the timeline</span></button></td>
        <td>${esc(r.name)}</td>
        <td>${v === "running" ? badge("Running", "b-live") : badge(v)}</td>
        <td class="detail">${detail}${rec}</td>
        <td class="num">${r.commands.length}</td>
        <td class="num">${ms(p.p50)}</td><td class="num">${ms(p.p95)}</td><td class="num">${ms(p.max)}</td>
        <td class="num">${r.done ? `${(r.wall_ms / 1000).toFixed(1)} s` : "—"}</td>
      </tr>`;
  }).join("");
  setHtml(document.getElementById("runs-table"), rows ? `<div style="overflow-x:auto"><table class="dtable runs-table">
      <thead><tr><th scope="col">Run</th><th scope="col">Scenario</th><th scope="col">Verdict</th><th scope="col">Detail</th><th scope="col" class="num">Commands</th><th scope="col" class="num">p50 ms</th><th scope="col" class="num">p95 ms</th><th scope="col" class="num">max ms</th><th scope="col" class="num">Wall</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>${page.runs.length > shown.length ? `<p class="runs-empty">… and ${page.runs.length - shown.length} earlier runs (pick them in the timeline).</p>` : ""}
    <p class="runs-empty">Latency is the gateway's <code class="mono">latency_us</code>: from receiving a command to receiving its batch. A command that waited out an outage is not a sample.</p>`
    : '<p class="runs-empty">No runs yet. Each run plays its scenario as every participant through the gateway, with its own accounts (<code class="mono">t0 × 100 + id</code>) and contract (<code class="mono">t0</code>).</p>');

  const run = V.run ?? page.runs.at(-1);
  const log = document.getElementById("runlog");
  const lines = run ? [`${runTag(run)} ${run.name}`, ...run.log] : ["The selected run's log appears here."];
  const html = lines.map((l) => {
    const cls = /outcome unknown|waiting for the engine|engine was down|STOPPED|outcome recovered: (?!rejected by design).*(?:rejected|unknown)/.test(l) ? "l-warn" : /^FAIL|failed|unavailable/.test(l) ? "l-bad" : /^PASS|outcome recovered/.test(l) ? "l-good" : "";
    return cls ? `<span class="${cls}">${esc(l)}</span>` : esc(l);
  }).join("\n");
  if (log.patched !== html) {
    const atEnd = log.scrollHeight - log.scrollTop - log.clientHeight < 24;
    log.innerHTML = html;
    log.patched = html;
    if (atEnd) log.scrollTop = log.scrollHeight;
  }
}

// ---- Failure drills ---------------------------------------------------------------------------------

const DRILLS = [
  ["drill-crash", "Engine crash mid-run", [["1", "docker compose kill engine"], ["2", "docker compose start engine"]], [
    "after the kill: status “engine down” (when nothing is being sent, noticing can take up to about 10 s); the command in flight says “outcome unknown … nonce N”; runs not yet started wait for the engine",
    "after the start: a Resume row in the trace, “engine up”, then the in-flight command's safe retry with the same nonce N: “nonce N taken once (Duplicate on retry)” with what the original did, or “retry applied” / “retry rejected”; a run in flight at the kill may FAIL on timing (its quotes expired meanwhile) or with “engine unavailable” (commands queued behind the in-flight one on the shared operator are refused); the waiting runs start and pass",
    "docker compose logs engine shows replayed seq=… hash=…, the hash it had before the kill",
  ]],
  ["drill-stall", "Stall", [["", "docker compose pause engine; sleep 2; docker compose unpause engine"]], [
    "a Resume row right after the unpause",
    "open dispute windows extended (OutcomeProposed again, with a later dispute_until), so a run in flight may FAIL on timing: the engine is right",
  ]],
  ["drill-aeron", "Driver crash", [["1", "docker compose kill aeron"], ["2", "docker compose up -d aeron engine gateway"]], [
    "after the kill: the engine is reported down about 3 s later; about 10 s after the kill the engine and the gateway exit and the page shows Reconnecting; nothing comes back by itself (Docker does not restart a container you killed, and the engine and gateway can't rejoin its dead IPC namespace)",
    "after the up: the engine replays its journal (replayed seq=… hash=…, the same hash) and the page is Connected again without a reload",
  ]],
  ["drill-term", "Driver crash, self-healing", [["", "docker compose exec aeron kill -TERM 1"]], [
    "the driver exits and Docker restarts it in about 1 s; the engine and the gateway follow, and the engine replays its journal (the same hash)",
    "the page shows Reconnecting, then Connected again without a reload; runs in flight lose their connection",
    "Docker restarts a container automatically at most three times over its lifetime (restart: on-failure:3), so this drill self-heals about three times before docker compose up -d is needed again",
  ]],
];

function renderDrills() {
  const cards = DRILLS.map(([id, title, cmds, watch]) => `<div class="drill">
      <h3 id="${id}-h">${esc(title)}</h3>
      ${cmds.map(([step, cmd], i) => `<div class="cmd-row">${step ? `<span class="muted" style="font-size:13px;align-self:center">${step}.</span>` : ""}<code id="${id}-cmd${i}">${esc(cmd)}</code><button class="btn btn-sm" type="button" data-action="copy" data-target="${id}-cmd${i}" data-key="${id}-copy${i}" aria-describedby="${id}-h">${icon("copy")}Copy</button></div>
      ${ui.copied?.key === `${id}-copy${i}` ? `<span class="copied" role="status">${esc(ui.copied.text)}</span>` : ""}`).join("")}
      <div><span class="muted" style="font-size:13px">What to watch</span><ul>${watch.map((w) => `<li>${esc(w)}</li>`).join("")}</ul></div>
    </div>`).join("");
  setHtml(document.getElementById("drills"), `<div class="panel-head"><h2 id="drills-h">Failure drills</h2><span class="muted" style="font-size:13px">run in a terminal at the repo root</span></div>
    <div class="panel-body drills">${cards}</div>`);
}

async function copyCommand(targetId, key) {
  const text = document.getElementById(targetId)?.textContent ?? "";
  let copied = false;
  try {
    await navigator.clipboard.writeText(text);
    copied = true;
  } catch {
    // No clipboard (a page opened from disk, or permission refused): select the text to copy by hand.
  }
  ui.copied = { key, text: copied ? "Copied." : "Selected: press ⌘C or Ctrl+C to copy." };
  render();
  if (!copied) {
    // After the render: the panel was rebuilt, so select the new element's text.
    const code = document.getElementById(targetId);
    const range = document.createRange();
    range.selectNodeContents(code);
    const sel = getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }
  // "Copied." fades after 4 s; a selection stays until the next copy (a re-render would drop it).
  if (copied) {
    setTimeout(() => {
      if (ui.copied?.key === key) {
        ui.copied = null;
        schedule();
      }
    }, 4000);
  }
}
