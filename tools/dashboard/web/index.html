  </main>

  <!-- Admin trace: filled by renderTrace and renderInspector -->
  <aside class="trace" aria-labelledby="trace-h">
    <div id="trace" style="display:contents">
      <div class="trace-head" id="trace-head"></div>
      <div class="log" id="log" role="log" aria-label="Command log"></div>
    </div>
    <div class="inspector" id="inspector" aria-labelledby="insp-h"></div>
  </aside>
</div>

<script>/*__RUNTIME_JS__*/</script>
<script>
const WASM_BASE64 = "__WASM_BASE64__";
const T0 = 1000; // presets::T0; times are shown as t+ from here
const ACCOUNTS = { OPERATOR: 1, ARBITER: 2, TREASURY: 3, ORACLE: 4, ALICE: 10, MM1: 20, MM2: 21, CAROL: 30 };
let engine, state = null, prev = null, presets = [], selected = null, playing = null;

function send(request) {
  const out = engine.call(request);
  if (out.error) { showError(out.error); return null; }
  if (out.snapshot) { prev = state; state = out; }
  render();
  return out;
}

const fmtUsd = (micro) => {
  const v = Math.abs(micro), sign = micro < 0 ? "−" : "";
  const dollars = Math.floor(v / 1e6), cents = Math.floor((v % 1e6) / 1e4);
  return `${sign}$${dollars.toLocaleString("en-US")}.${String(cents).padStart(2, "0")}${v % 1e4 ? "+" : ""}`;
};
const fmtPrice = (bps) => (bps / 10000).toFixed(4).replace(/0{1,2}$/, ""); // 6000 → "0.60"
const fmtT = (ms) => `t+${((ms - T0) / 1000).toFixed(3)} s`;
const DISPLAY_NAMES = { 1: "Operator", 2: "Arbiter", 3: "Treasury", 4: "Oracle", 10: "Alice", 20: "MM1", 21: "MM2", 30: "Carol" };
const name = (id) => state?.snapshot.accounts.find((a) => a.id === id)?.name ?? DISPLAY_NAMES[id] ?? `#${id}`;
const variant = (v) => (typeof v === "string" ? v : Object.keys(v)[0]); // serde enum → its variant name

(async () => {
  const bytes = Uint8Array.from(atob(WASM_BASE64), (c) => c.charCodeAt(0));
  engine = await createEngine(bytes);
  presets = engine.call({ op: "presets" }).presets;
  send({ op: "reset", mode: "sandbox" });
})().catch((e) => showError(`The engine failed to start: ${e}`));

// ---------------------------------------------------------------------------------------------
// Everything below only formats what the engine returned and turns clicks into engine requests.
// It never computes money or fires a timer: amounts and prices are the engine's integers.

const root = document.documentElement;
const app = document.getElementById("app");
const PLAY_MS = 700;
const TOAST_MS = 4000;
const LIVE_QUOTE = ["Active", "Selected"];
const LIVE_REQUEST = ["Open", "Presented"];
const VIEWS = [["Admin", "admin"], ["Alice", ACCOUNTS.ALICE], ["Carol", ACCOUNTS.CAROL], ["MM1", ACCOUNTS.MM1], ["MM2", ACCOUNTS.MM2]];
const MSG = {
  price: "Enter a price between 0.01 and 99.99.",
  shares: "Enter a whole number of shares.",
  seconds: "Enter a number of seconds above 0.",
};
// Badges encode meaning, never sequence, and always carry their text (DESIGN §10).
const BADGE = {
  Open: "b-live", Active: "b-live", Presented: "b-live", Trading: "b-live", Closed: "b-live", Proposed: "b-live",
  Selected: "b-warn", Disputed: "b-warn",
  Filled: "b-good", Final: "b-good",
  Lost: "b-gone", Released: "b-gone", Expired: "b-gone", Cancelled: "b-gone", Replaced: "b-gone",
  Rejected: "b-bad",
};

// Page-only state: open forms, typed drafts, inline errors and rejection toasts. Never engine data.
const ui = {
  open: new Set(), drafts: new Map(), errors: new Map(),
  rows: new Map(),     // trace seq → expanded (true) or collapsed (false), when the presenter chose
  filter: "all",       // trace filter chip
  logPinned: true,     // the log follows new rows until the presenter scrolls up
  tab: "d1",           // deliverables tab
  replay: null,        // the last replay check, shown until the next command
  ledgerBase: null,    // balances before the last response that ran commands, for the ledger's deltas
};
const toasts = new Map(); // card key → { texts, timer }
let rendered = null;      // the response the last render collected toasts from

// ---- Formatting helpers --------------------------------------------------------------------

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const qty = (n) => n.toLocaleString("en-US");
const sideName = (s) => (s === "BuyYes" ? "YES" : "NO");
const outcomeName = (o) => String(o).toUpperCase();
const secs = (ms) => `${(ms / 1000).toFixed(3)} s`;
const clockText = (ms) => (ms < T0 ? "start" : fmtT(ms));
const due = (ts) => (ts > state.snapshot.now ? `in ${secs(ts - state.snapshot.now)}` : "now");
const isAdmin = () => state.viewer === "admin";
const viewerId = () => (state.viewer === "admin" ? null : state.viewer.account);
const icon = (id) => `<svg aria-hidden="true"><use href="#i-${id}"/></svg>`;
const sealedMark = (text) => `<span class="sealed">${icon("lock")}${esc(text)}</span>`;
const badge = (text, cls) => `<span class="badge ${cls ?? BADGE[text] ?? "b-gone"}">${esc(text)}</span>`;
const byIdDesc = (a, b) => b.id - a.id;
const disabledIf = (off, why) => (off ? ` disabled${why ? ` title="${esc(why)}"` : ""}` : "");

/** An id that selects its object for the inspector. `where` keeps the focus key unique per card. */
const idlink = (kind, id, text, where) =>
  `<button class="idlink" type="button" data-action="select" data-kind="${kind}" data-id="${id}" data-key="sel-${where}-${kind}-${id}">${esc(text)}</button>`;

/**
 * The new rows: seqs this response appended that the current viewer can see in its trace.
 * `new_seqs` may name seqs hidden from the viewer; those are ignored. Empty after a reset.
 */
function newSeqs() {
  const fresh = new Set(state.new_seqs);
  return new Set(state.trace.filter((e) => fresh.has(e.seq)).map((e) => e.seq));
}

/** The last nonce the engine consumed for an account: Duplicate and NonceGap consume nothing. */
function lastNonce(id) {
  let n = 0;
  for (const e of state.trace) {
    if (e.actor !== id || e.nonce == null) continue;
    const unconsumed = e.events.some((ev) => ["Duplicate", "NonceGap"].includes(ev.event?.CommandRejected?.reason));
    if (!unconsumed && e.nonce > n) n = e.nonce;
  }
  return n;
}

/** The dispute bond from this run's Genesis config, when the trace carries it. */
function disputeBond() {
  const g = state.trace.find((e) => e.kind === "genesis")?.command?.Genesis;
  return g?.config?.dispute_bond ?? null;
}

/** Every visible event of one variant, with the trace entry it came in. */
function eventsNamed(variantName) {
  const out = [];
  for (const e of state.trace) for (const ev of e.events) if (variant(ev.event) === variantName) out.push({ entry: e, data: ev.event[variantName] });
  return out;
}

// ---- Render ----------------------------------------------------------------------------------

function render() {
  if (!state) return;
  const focus = rememberFocus();
  if (rendered !== state) {
    rendered = state;
    clearError();
    collectToasts();
    trackResponse();
  }
  root.dataset.view = isAdmin() ? "admin" : (VIEWS.find(([, v]) => v === viewerId())?.[0] ?? "account").toLowerCase();
  renderTopBar();
  renderUsers();
  renderContract();
  renderMarketMakers();
  renderTrace();
  renderLedger();
  renderInspector();
  renderPanels();
  followLog();
  restoreFocus(focus);
}

function select(kind, id) {
  selected = { kind, id };
  render();
}

/**
 * Once per engine response. The ledger's delta baseline is the snapshot before the last response
 * that ran commands (one step, or a whole Run to end), taken for the same viewer. A replay check
 * runs none and keeps the deltas; a view switch or a reset drops them. A replay check's result
 * stays until the next command.
 */
function trackResponse() {
  const s = state.snapshot, p = prev?.snapshot;
  // A baseline from another viewer's snapshot would give a partial set of deltas: drop it.
  const sameViewer = JSON.stringify(prev?.viewer) === JSON.stringify(state.viewer);
  if (!p || prev.mode !== state.mode || !sameViewer || s.seq < p.seq) ui.ledgerBase = null;
  else if (s.seq > p.seq) ui.ledgerBase = { seq: p.seq, total: p.total, balances: new Map(p.accounts.map((a) => [a.id, a.balance])) };
  if (state.replay) ui.replay = { ...state.replay, seq: s.seq, mode: state.mode };
  else if (ui.replay && (ui.replay.seq !== s.seq || ui.replay.mode !== state.mode)) ui.replay = null;
}

/** Containers are rebuilt with innerHTML, so keep keyboard focus (and the caret) on the same control. */
function rememberFocus() {
  const el = document.activeElement;
  if (!el || el === document.body) return null;
  const key = el.id || el.dataset?.key;
  if (!key) return null;
  let range = null;
  try { if (typeof el.selectionStart === "number") range = [el.selectionStart, el.selectionEnd]; } catch { range = null; }
  return { el, key, range };
}
function restoreFocus(f) {
  if (!f || document.contains(f.el)) return;
  const el = document.getElementById(f.key) ?? [...document.querySelectorAll("[data-key]")].find((x) => x.dataset.key === f.key);
  if (!el || el.disabled) return;
  el.focus({ preventScroll: true });
  if (f.range && el.setSelectionRange) try { el.setSelectionRange(...f.range); } catch { /* not a text field */ }
}

// ---- Top bar and scenario strip --------------------------------------------------------------

function renderTopBar() {
  const s = state.snapshot, p = state.preset;
  const picker = document.getElementById("preset");
  if (picker.dataset.ready !== "1" && presets.length) {
    const group = (label, kind, text) => `<optgroup label="${label}">${presets.filter((x) => x.kind === kind)
      .map((x) => `<option value="${esc(x.name)}">${esc(text(x))}</option>`).join("")}</optgroup>`;
    picker.innerHTML = group("Sandbox", "sandbox", () => "Sandbox: drive it by hand")
      + group("Brief scenarios", "brief", (x) => x.name) + group("Attacks", "attack", (x) => x.name);
    picker.dataset.ready = "1";
    picker.disabled = false;
  }
  picker.value = state.mode;

  const why = !p ? "Pick a scenario to step through it"
    : p.taken_over ? "Taken over: reset to replay the script"
    : p.finished ? "The script has finished: reset to run it again" : "";
  document.getElementById("tb-run").innerHTML = `
    <button class="btn btn-primary" type="button" id="tb-step" data-action="step"${disabledIf(why, why)}>${icon("step")}Step</button>
    <button class="btn" type="button" id="tb-play" data-action="play"${disabledIf(why && !playing, why)}>${playing ? `${icon("pause")}Pause` : `${icon("play")}Play`}</button>
    <button class="btn" type="button" id="tb-end" data-action="run-all"${disabledIf(why, why)}>${icon("end")}Run to end</button>
    <button class="btn btn-quiet" type="button" id="tb-reset" data-action="reset">${icon("reset")}Reset</button>
    <button class="btn btn-quiet" type="button" id="tb-takeover" data-action="take-over"${disabledIf(why, why)}>${icon("hand")}Take over</button>`;

  const nextWhy = !isAdmin() ? "Switch to Admin to jump to the next timer"
    : s.next_timer == null ? "No timer is pending" : "";
  document.getElementById("tb-clock").innerHTML = `
    <span class="clock num" title="Engine time. It moves only when a command is stamped.">${clockText(s.now)}</span>
    <button class="btn btn-sm" type="button" id="tb-100ms" data-action="advance" data-ms="100">+100 ms</button>
    <button class="btn btn-sm" type="button" id="tb-1s" data-action="advance" data-ms="1000">+1 s</button>
    <button class="btn btn-sm" type="button" id="tb-next" data-action="next-timer"${nextWhy ? disabledIf(true, nextWhy) : ` title="Fire the next timer, at ${fmtT(s.next_timer)}"`}>Next timer</button>`;

  const me = viewerId();
  document.getElementById("tb-view").innerHTML = `<span class="group-label" id="viewas-label">View as</span>
    <div class="seg-ctl" id="viewas" role="group" aria-labelledby="viewas-label">${VIEWS.map(([label, v]) =>
      `<button type="button" id="view-${label}" data-action="view" data-viewer="${v}" aria-pressed="${v === "admin" ? me === null : me === v}">${label}</button>`).join("")}</div>`;

  const inv = s.invariants.ok
    ? badge("I1–I5 hold", "b-good")
    : `<span class="badge b-bad" title="${esc(s.invariants.error ?? "")}">I1–I5 BROKEN<span class="sr-only">: ${esc(s.invariants.error ?? "")}</span></span>`;
  document.getElementById("tb-health").innerHTML = `<dl>
      <div><dt>seq</dt><dd class="num">${s.seq}</dd></div>
      <div><dt>state hash</dt><dd class="mono" title="${esc(s.state_hash)}">${esc(s.state_hash.slice(0, 8))}</dd></div>
    </dl>${inv}
    <button class="btn btn-quiet btn-sm" type="button" id="theme" data-action="theme">${icon("theme")}Theme</button>`;

  renderScenario();
}

/**
 * Which expected events this viewer has seen, matched in order like the runner's verdict. One the
 * viewer can't see (or that hasn't happened) stays unlit without hiding the ones after it.
 */
function seenExpect(expect) {
  const names = state.trace.flatMap((e) => e.events.map((ev) => {
    const v = variant(ev.event);
    return v === "CommandRejected" ? [v, `${v}(${ev.event.CommandRejected.reason})`] : [v];
  }));
  let from = 0;
  return expect.map((want) => {
    const at = names.findIndex((n, k) => k >= from && n.includes(want));
    if (at < 0) return false;
    from = at + 1;
    return true;
  });
}

function renderScenario() {
  const el = document.getElementById("scenario");
  const p = state.preset;
  if (!p) {
    const sandbox = presets.find((x) => x.kind === "sandbox");
    el.innerHTML = `<div>
        <div class="scenario-title"><h2>Sandbox</h2>${badge("Sandbox", "b-live")}</div>
        <p>${esc(sandbox?.summary ?? "")}</p>
      </div>
      <div class="progress"><div>No script</div><div>Every command here is yours.</div></div>`;
    return;
  }
  const v = p.finished ? p.verdict : null;
  const title = [
    `<h2>${esc(p.name)}</h2>`,
    badge(p.kind === "attack" ? "Attack" : "Brief scenario", "b-live"),
    p.taken_over ? badge("Taken over", "b-warn") : "",
    v ? badge(v.pass ? "PASS" : "FAIL", v.pass ? "b-good" : "b-bad") : "",
  ].join("");
  const progress = p.taken_over
    ? `<div>Script stopped after step <strong>${p.step}</strong> of ${p.steps}</div><div>You're driving by hand. Reset to replay the script.</div>`
    : p.finished
      ? `<div>Finished: step <strong>${p.step}</strong> of ${p.steps}</div><div>${v && !v.pass ? esc(v.detail ?? "An expected event is missing.") : "Every expected event happened in order."}</div>`
      : `<div>Step <strong>${p.step}</strong> of ${p.steps}</div><div>Next: <strong>${esc(p.next ?? "")}</strong></div>`;
  const seen = seenExpect(p.expect);
  const chips = p.expect.map((x, i) => `<span class="chip${seen[i] ? " seen" : ""}">${esc(x)}${seen[i] ? '<span class="sr-only"> (seen)</span>' : ""}</span>`).join("");
  el.innerHTML = `<div>
      <div class="scenario-title">${title}</div>
      ${isAdmin() ? `<p>${esc(p.summary)}</p>` : '<p class="muted">Script narration is shown in the Admin view.</p>'}
    </div>
    <div class="progress">${progress}</div>
    <div class="expect" role="group" aria-label="Expected events, in order">${chips}</div>`;
}

// ---- Shared card parts -----------------------------------------------------------------------

function partyHead(a) {
  return `<div class="party-head"><h3>${esc(a.name)}</h3><span class="meta">account ${a.id}, nonce ${lastNonce(a.id)}</span></div>`;
}

/** The free / reserved / escrowed split as a bar. Widths are layout only. */
function splitBar(balance) {
  const { free, reserved, escrowed } = balance;
  const total = free + reserved + escrowed;
  const segs = [["free", free], ["reserved", reserved], ["escrowed", escrowed]]
    .filter(([, v]) => v > 0)
    .map(([k, v]) => `<div class="seg ${k}" style="width:${((v / total) * 100).toFixed(2)}%"></div>`).join("");
  return `<div class="bar" role="img" aria-label="Free ${fmtUsd(free)}, reserved ${fmtUsd(reserved)}, escrowed ${fmtUsd(escrowed)}">${segs}</div>`;
}

function balances(a) {
  const { free, reserved, escrowed } = a.balance;
  return `<div class="balances">
      ${splitBar(a.balance)}
      <div class="balance-nums"><span>Free <b>${fmtUsd(free)}</b></span><span>Reserved <b>${fmtUsd(reserved)}</b></span><span>Escrowed <b>${fmtUsd(escrowed)}</b></span></div>
    </div>`;
}

/** The side of a position an account holds, and its lock: display only, from the engine's numbers. */
const lockOf = (p, id) => (p.yes_holder === id ? p.yes_lock : p.no_lock);

function toastHtml(card) {
  const t = toasts.get(card);
  return t ? t.texts.map((text) => `<p class="toast" role="status" data-toast="${card}">${esc(text)}</p>`).join("") : "";
}

/** Which card a command's actor acts from: requesters and market makers have one; the rest use the contract's. */
function cardOf(actor) {
  if (actor === ACCOUNTS.ALICE || actor === ACCOUNTS.CAROL) return `user-${actor}`;
  if (actor === ACCOUNTS.MM1 || actor === ACCOUNTS.MM2) return `mm-${actor}`;
  return "contract";
}

/** A rejection is not an error: it shows as a short toast in the acting card for 4 s (and in the trace). */
function collectToasts() {
  const fresh = newSeqs();
  const batch = new Map();
  for (const e of state.trace) {
    if (!fresh.has(e.seq) || e.actor == null) continue;
    for (const ev of e.events) {
      const reason = ev.event?.CommandRejected?.reason;
      if (!reason) continue;
      const args = e.command?.User?.action ? Object.values(e.command.User.action)[0] : null;
      const field = ["quote", "request", "contract"].find((f) => args?.[f] != null);
      const what = `${e.kind}${field ? `, ${field} #${args[field]}` : ""}`;
      const card = cardOf(e.actor);
      batch.set(card, [...(batch.get(card) ?? []), `Rejected: ${reason} (${what})`]);
    }
  }
  for (const [card, texts] of batch) {
    clearTimeout(toasts.get(card)?.timer);
    const entry = { texts };
    entry.timer = setTimeout(() => {
      if (toasts.get(card) !== entry) return;
      toasts.delete(card);
      document.querySelectorAll(`[data-toast="${card}"]`).forEach((n) => n.remove());
    }, TOAST_MS);
    toasts.set(card, entry);
  }
}

function clearToasts() {
  for (const t of toasts.values()) clearTimeout(t.timer);
  toasts.clear();
}

// ---- Forms -----------------------------------------------------------------------------------

function draft(key, defaults) {
  return { ...defaults, ...(ui.drafts.get(key) ?? {}) };
}

function field(key, fieldName, label, value, inputmode, unit, help) {
  const id = `${key}-${fieldName}`;
  const err = ui.errors.get(key)?.[fieldName];
  const describedBy = [err ? `${id}-err` : "", help ?? ""].filter(Boolean).join(" ");
  const input = `<input id="${id}" name="${fieldName}" inputmode="${inputmode}" autocomplete="off" value="${esc(value)}"`
    + `${err ? ' aria-invalid="true"' : ""}${describedBy ? ` aria-describedby="${describedBy}"` : ""}>`;
  return `<label class="field">${label}${unit ? `<span class="unit">${input}<span>${unit}</span></span>` : input}</label>`;
}

function fieldErrors(key, order) {
  const errs = ui.errors.get(key) ?? {};
  return order.filter((f) => errs[f]).map((f) => `<p class="field-error" id="${key}-${f}-err" role="alert">${esc(errs[f])}</p>`).join("");
}

/** Cents → bps, or null outside 0.01–99.99. */
function parseCents(text) {
  const t = text.trim();
  if (!/^(\d+\.?\d*|\.\d+)$/.test(t)) return null;
  const cents = Number(t);
  return cents >= 0.01 && cents <= 99.99 ? Math.round(cents * 100) : null;
}
function parseWhole(text) {
  const t = text.replace(/[,_\s]/g, "");
  if (!/^\d+$/.test(t)) return null;
  const n = Number(t);
  return n >= 1 && Number.isSafeInteger(n) ? n : null;
}
/** Seconds from now → ms, or null. The engine turns `now + ms` into its own timer. */
function parseSeconds(text) {
  const t = text.trim();
  if (!/^(\d+\.?\d*|\.\d+)$/.test(t)) return null;
  const ms = Math.round(Number(t) * 1000);
  return ms >= 1 && Number.isSafeInteger(state.snapshot.now + ms) ? ms : null;
}

/** Inline errors block sending; the first invalid field takes focus. */
function rejectForm(key, errs) {
  ui.errors.set(key, errs);
  render();
  document.getElementById(`${key}-${Object.keys(errs)[0]}`)?.focus();
}

function submitQuote(form) {
  const key = form.dataset.key, mm = Number(form.dataset.actor), request = Number(form.dataset.request);
  const v = Object.fromEntries(new FormData(form));
  const errs = {};
  const price = parseCents(v.price ?? "");
  if (price == null) errs.price = MSG.price;
  const size = parseWhole(v.size ?? "");
  if (size == null) errs.size = MSG.shares;
  const ms = parseSeconds(v.expiry ?? "");
  if (ms == null) errs.expiry = MSG.seconds;
  if (Object.keys(errs).length) return rejectForm(key, errs);
  ui.errors.delete(key);
  const action = { SubmitQuote: { request, leg: 0, price, size, expires_at: state.snapshot.now + ms } };
  if (act(mm, action)) {
    ui.drafts.delete(key);
    render();
  }
}

function submitRequest(form) {
  const key = form.dataset.key, actor = Number(form.dataset.actor);
  const contract = state.snapshot.contracts[0];
  const v = Object.fromEntries(new FormData(form));
  const errs = {};
  const n = parseWhole(v.qty ?? "");
  if (n == null) errs.qty = MSG.shares;
  const limit = parseCents(v.limit ?? "");
  if (limit == null) errs.limit = MSG.price;
  const ms = parseSeconds(v.deadline ?? "");
  if (ms == null) errs.deadline = MSG.seconds;
  if (Object.keys(errs).length) return rejectForm(key, errs);
  ui.errors.delete(key);
  if (!contract) return;
  act(actor, {
    SubmitRequest: {
      legs: [{ contract: contract.id, side: v.side === "BuyNo" ? "BuyNo" : "BuyYes", qty: n, limit_price: limit }],
      response_deadline: state.snapshot.now + ms,
    },
  });
}

// ---- Requesters lane -------------------------------------------------------------------------

function renderUsers() {
  const el = document.getElementById("user-lane");
  const mine = state.snapshot.accounts.filter((a) => a.role === "requester");
  const who = esc(name(viewerId()));
  const body = mine.length ? mine.map(requesterCard).join("")
    : `<article class="party" aria-label="Requesters as ${who} sees them">
        <p class="empty">As ${who} you don't see who asks or their limits. Open requests appear in your card.</p>
      </article>`;
  el.innerHTML = `<div class="side-head"><h2 id="req-h">Requesters</h2><span>ask for a price</span></div>${body}`;
}

function requesterCard(a) {
  const s = state.snapshot;
  const theirs = s.requests.filter((r) => r.requester === a.id).sort(byIdDesc);
  const live = theirs.filter((r) => LIVE_REQUEST.includes(variant(r.state)));
  const ended = theirs.filter((r) => !LIVE_REQUEST.includes(variant(r.state)));
  const proposed = s.contracts.filter((c) => variant(c.state) === "Proposed");
  const items = [...proposed.map((c) => disputeItem(a, c)), ...live.map((r) => requestItem(a, r)), ...ended.map((r) => requestItem(a, r))].join("");
  return `<article class="party" aria-label="${esc(a.name)}">
      ${partyHead(a)}
      ${balances(a)}
      ${items || '<p class="empty">No requests yet.</p>'}
      ${toastHtml(`user-${a.id}`)}
      ${requestForm(a)}
    </article>`;
}

function requestItem(a, r) {
  const s = state.snapshot, st = variant(r.state), leg = r.legs[0], where = `u${a.id}`;
  const head = [idlink("request", r.id, `Request #${r.id}`, where), badge(st)];
  if (st === "Rejected") head.push(`<span class="muted" style="font-size:13px">cause: ${esc(r.state.Rejected)}</span>`);
  const facts = [`<span>Buy <b>${sideName(leg.side)}</b> × <b>${qty(leg.qty)}</b></span>`];
  if (leg.limit_price != null) facts.push(`<span>Limit <b>${fmtPrice(leg.limit_price)}</b></span>`);
  facts.push(`<span>${idlink("contract", leg.contract, `Contract #${leg.contract}`, `${where}r${r.id}`)}</span>`);
  const rows = [`<div class="item-facts">${facts.join("")}</div>`];
  const btn = (action, label, cls) =>
    `<button class="btn ${cls}" type="button" data-action="${action}" data-actor="${a.id}" data-request="${r.id}" data-key="${action}-${r.id}">${label}</button>`;
  if (st === "Open") {
    rows.push(`<div class="item-facts"><span>Quotes due <span class="countdown">${due(r.response_deadline)}</span> (${fmtT(r.response_deadline)})</span></div>`);
    rows.push(`<div class="item-actions">${btn("cancel-request", "Cancel request", "btn-sm")}</div>`);
  } else if (st === "Presented") {
    const acceptBy = r.state.Presented.accept_by;
    const picks = r.picks.map((k) => `<span>Best quote ${idlink("quote", k.quote, `#${k.quote}`, `${where}r${r.id}`)} at <b>${fmtPrice(k.price)}</b></span>`).join("");
    rows.push(`<div class="item-facts">${picks}<span>Accept within <span class="countdown">${acceptBy > s.now ? secs(acceptBy - s.now) : "0.000 s"}</span> (${fmtT(acceptBy)})</span></div>`);
    const at = r.picks.length === 1 ? ` at ${fmtPrice(r.picks[0].price)}` : "";
    rows.push(`<div class="item-actions">${btn("accept", `Accept${at}`, "btn-primary")}${btn("reject", "Reject", "")}</div>`);
  } else if (st === "Filled") {
    const p = s.positions.find((x) => x.request === r.id);
    if (p) rows.push(`<div class="item-facts"><span>Position #${p.id}</span><span>${p.settled ? "Settled" : `Escrowed <b>${fmtUsd(lockOf(p, a.id))}</b>`}</span></div>`);
  }
  return `<div class="item"><div class="item-head">${head.join("")}</div>${rows.join("")}</div>`;
}

function disputeItem(a, c) {
  const { outcome, dispute_until } = c.state.Proposed;
  const bond = disputeBond();
  return `<div class="item">
      <div class="item-head">${idlink("contract", c.id, `Contract #${c.id}`, `u${a.id}d`)}${badge("Proposed")}<span class="muted" style="font-size:13px">oracle says ${outcomeName(outcome)}</span></div>
      <div class="item-facts"><span>Dispute until <b>${fmtT(dispute_until)}</b></span>${bond != null ? `<span>Bond <b>${fmtUsd(bond)}</b></span>` : ""}</div>
      <div class="item-actions"><button class="btn btn-sm btn-danger" type="button" data-action="dispute" data-actor="${a.id}" data-contract="${c.id}" data-key="dispute-${a.id}-${c.id}">Dispute</button></div>
    </div>`;
}

function requestForm(a) {
  const key = `req-${a.id}`;
  const open = ui.open.has(key);
  const toggle = `<button class="btn btn-quiet btn-sm" type="button" id="${key}-toggle" data-action="toggle" data-target="${key}" aria-expanded="${open}"${open ? ` aria-controls="${key}-form"` : ""}>New request</button>`;
  if (!open) return `<div>${toggle}</div>`;
  const contract = state.snapshot.contracts[0];
  const d = draft(key, { side: "BuyYes", qty: "1000", limit: "70", deadline: "1.5" });
  const option = (v, label) => `<option value="${v}"${d.side === v ? " selected" : ""}>${label}</option>`;
  return `<div>${toggle}
      <form class="form-row" id="${key}-form" data-form="request" data-key="${key}" data-actor="${a.id}" novalidate style="margin-top:8px;grid-template-columns:repeat(4,minmax(0,1fr)) auto">
        <label class="field">Side<select id="${key}-side" name="side">${option("BuyYes", "Buy YES")}${option("BuyNo", "Buy NO")}</select></label>
        ${field(key, "qty", "Shares", d.qty, "numeric")}
        ${field(key, "limit", "Limit", d.limit, "decimal", "¢", `${key}-help`)}
        ${field(key, "deadline", "Due in", d.deadline, "decimal", "s")}
        <button class="btn btn-primary" type="submit"${disabledIf(!contract, "No contract is listed yet")}>Ask</button>
      </form>
      ${fieldErrors(key, ["qty", "limit", "deadline"])}
      <p id="${key}-help" class="muted" style="font-size:13px;margin-top:4px">Your limit stays sealed: market makers never see it.</p>
    </div>`;
}

// ---- Market makers lane ----------------------------------------------------------------------

function renderMarketMakers() {
  const el = document.getElementById("mm-lane");
  const mine = state.snapshot.accounts.filter((a) => a.role === "market_maker");
  const who = esc(name(viewerId()));
  const body = mine.length ? mine.map(makerCard).join("")
    : `<article class="party" aria-label="Market makers as ${who} sees them">
        <p class="empty">As ${who} you don't see market makers or their quotes. The best quote is presented in your card.</p>
      </article>`;
  el.innerHTML = `<div class="side-head"><h2 id="mm-h">Market makers</h2><span>answer with sealed quotes</span></div>${body}`;
}

function makerCard(a) {
  const s = state.snapshot;
  const quotes = s.quotes.filter((q) => q.mm === a.id).sort(byIdDesc);
  const live = quotes.filter((q) => LIVE_QUOTE.includes(q.state));
  const ended = quotes.filter((q) => !LIVE_QUOTE.includes(q.state));
  const open = s.requests.filter((r) => r.public_state === "open")
    .sort((x, y) => x.response_deadline - y.response_deadline || x.id - y.id);
  const items = [...live.map((q) => quoteItem(a, q)), ...open.map((r) => openRequestItem(a, r)), ...ended.map((q) => quoteItem(a, q))].join("");
  return `<article class="party" aria-label="${esc(a.name)}">
      ${partyHead(a)}
      ${balances(a)}
      ${items || '<p class="empty">No open requests to quote on.</p>'}
      ${toastHtml(`mm-${a.id}`)}
    </article>`;
}

/** An open request as every MM sees it: contract, side, qty and deadline. Never the limit, even as admin. */
function openRequestItem(a, r) {
  const leg = r.legs[0], key = `q-${a.id}-${r.id}`, where = `m${a.id}`;
  const replacing = state.snapshot.quotes.some((q) => q.mm === a.id && q.request === r.id && LIVE_QUOTE.includes(q.state));
  const verb = replacing ? "Replace" : "Quote";
  const head = `<div class="item-head">${idlink("request", r.id, `Request #${r.id}`, where)}${badge("Open")}<span class="muted" style="font-size:13px">quotes due ${due(r.response_deadline)}</span></div>`;
  const facts = `<div class="item-facts"><span>Buy <b>${sideName(leg.side)}</b> × <b>${qty(leg.qty)}</b></span><span>${idlink("contract", leg.contract, `Contract #${leg.contract}`, `${where}r${r.id}`)}</span>${sealedMark("limit sealed")}</div>`;
  // The quote form sits inline on every open request, as in the mockup.
  const d = draft(key, { price: "", size: String(leg.qty), expiry: "10" });
  return `<div class="item">${head}${facts}
      <form class="form-row" id="${key}-form" data-form="quote" data-key="${key}" data-actor="${a.id}" data-request="${r.id}" novalidate aria-label="${verb} on request #${r.id}">
        ${field(key, "price", "Price", d.price, "decimal", "¢")}
        ${field(key, "size", "Shares", d.size, "numeric")}
        ${field(key, "expiry", "Expires in", d.expiry, "decimal", "s")}
        <button class="btn btn-primary" type="submit" id="${key}-submit">${verb}</button>
      </form>
      ${fieldErrors(key, ["price", "size", "expiry"])}
    </div>`;
}

function quoteItem(a, q) {
  const s = state.snapshot, where = `m${a.id}`;
  const leg = s.requests.find((r) => r.id === q.request)?.legs[q.leg];
  const facts = [`<span>Sell ${leg ? sideName(leg.side) : ""} at <b>${fmtPrice(q.price)}</b> × <b>${qty(q.size)}</b></span>`];
  const live = LIVE_QUOTE.includes(q.state);
  if (live) {
    // What the quote's hold reserves, as the engine computed it (on the leg's qty, not the size).
    if (q.reserved != null) facts.push(`<span>Holds <b>${fmtUsd(q.reserved)}</b></span>`);
    facts.push(`<span>${q.state === "Selected" ? "Firm until" : "Expires"} ${fmtT(q.expires_at)}</span>`);
  } else if (q.state === "Filled") {
    const p = s.positions.find((x) => x.request === q.request);
    facts.push(p ? `<span>Position #${p.id}</span><span>${p.settled ? "Settled" : `Escrowed <b>${fmtUsd(lockOf(p, a.id))}</b>`}</span>` : "<span>Hold moved to escrow</span>");
  } else {
    facts.push("<span>Hold released</span>");
  }
  // Cancel shows on every live quote: the engine answers for a Selected one, which is part of the demo.
  const actions = live
    ? `<div class="item-actions"><button class="btn btn-sm btn-danger" type="button" data-action="cancel-quote" data-actor="${a.id}" data-quote="${q.id}" data-key="cancel-quote-${q.id}">Cancel quote</button></div>`
    : "";
  return `<div class="item">
      <div class="item-head">${idlink("quote", q.id, `Quote #${q.id}`, where)}${badge(q.state)}<span class="muted" style="font-size:13px">on request ${idlink("request", q.request, `#${q.request}`, `${where}q${q.id}`)}</span></div>
      <div class="item-facts">${facts.join("")}</div>
      ${actions}
    </div>`;
}

// ---- Contract card ---------------------------------------------------------------------------

function renderContract() {
  const el = document.getElementById("contract");
  const list = state.snapshot.contracts;
  el.innerHTML = list.length ? list.map(contractCard).join("")
    : `<article class="panel contract"><div class="contract-main">
        <p class="empty">No contract is listed yet. The operator lists one during setup.</p>
        ${toastHtml("contract")}
      </div></article>`;
}

/** When the oracle proposed and how long the dispute window ran, from the public OutcomeProposed event. */
function proposalOf(c) {
  const last = eventsNamed("OutcomeProposed").filter((x) => x.data.contract === c.id).pop();
  if (last) return { at: last.entry.time, until: last.data.dispute_until, outcome: last.data.outcome };
  return null;
}

function timeline(c) {
  const now = state.snapshot.now;
  const span = Math.max(1, c.resolution_deadline - T0);
  // Layout only: where each engine timestamp sits between t+0 and the hard deadline.
  const at = (t) => Math.min(100, Math.max(0, ((t - T0) / span) * 100));
  const pct = (t) => `${at(t).toFixed(2)}%`;
  const p = proposalOf(c);
  const parts = [
    '<div class="tl-track"></div>',
    `<div class="tl-trading" style="width:${pct(c.trading_close)}"></div>`,
  ];
  if (p) {
    parts.push(`<div class="tl-trading" style="left:${pct(p.at)};width:${(at(p.until) - at(p.at)).toFixed(2)}%;background:var(--warn);border-radius:0" title="Dispute window: proposed ${fmtT(p.at)}, open until ${fmtT(p.until)}"></div>`);
  }
  const flip = at(now) > 70 ? ' style="left:auto;right:6px"' : "";
  parts.push(`<div class="tl-now" style="left:${pct(now)}"><span${flip}>now ${fmtT(now)}</span></div>`);
  parts.push(`<div class="tl-mark" style="left:${pct(c.trading_close)}"><span>trading closes ${fmtT(c.trading_close)}</span></div>`);
  if (p) {
    parts.push(`<div class="tl-mark" style="left:${pct(p.at)};height:14px;top:26px;opacity:.7" title="Proposed ${fmtT(p.at)}"></div>`);
    parts.push(`<div class="tl-mark" style="left:${pct(p.until)}" title="Dispute window ends ${fmtT(p.until)}"></div>`);
  }
  parts.push(`<div class="tl-mark end" style="left:calc(100% - 2px)"><span>hard deadline ${fmtT(c.resolution_deadline)}</span></div>`);
  const label = [`Now ${fmtT(now)}.`, `Trading closes ${fmtT(c.trading_close)}.`];
  if (p) label.push(`Proposed ${outcomeName(p.outcome)} at ${fmtT(p.at)}, dispute window until ${fmtT(p.until)}.`);
  label.push(`Hard deadline ${fmtT(c.resolution_deadline)}.`);
  return `<div class="timeline" role="img" aria-label="${label.join(" ")}">${parts.join("")}</div>`;
}

function contractCard(c) {
  const st = variant(c.state);
  const meta = [badge(st), idlink("contract", c.id, `Contract #${c.id}`, "cc"), `<span>Oracle: account ${c.oracle}</span>`];
  if (st === "Proposed") meta.push(`<span>Proposed <b>${outcomeName(c.state.Proposed.outcome)}</b>, dispute until ${fmtT(c.state.Proposed.dispute_until)}</span>`);
  if (st === "Disputed") meta.push(`<span>Proposed <b>${outcomeName(c.state.Disputed.proposed)}</b>, disputed by ${esc(name(c.dispute?.disputer))}${c.dispute?.hold != null ? ", bond held" : ""}</span>`);
  if (st === "Final") meta.push(`<span>Outcome <b>${outcomeName(c.state.Final)}</b></span>`);
  const bond = disputeBond();
  const windowS = (c.dispute_window / 1000).toLocaleString("en-US", { maximumFractionDigits: 3 });
  // The engine answers the oracle and arbiter only, so only admin sees what their buttons did.
  const actorWhy = isAdmin() ? "" : "Switch to Admin to act as the oracle or arbiter";
  const outcomes = (action, actor) => [["Yes", "YES", "btn-yes"], ["No", "NO", "btn-no"], ["Invalid", "INVALID", ""]]
    .map(([o, label, cls]) => `<button class="btn btn-sm ${cls}" type="button" data-action="${action}" data-actor="${actor}" data-contract="${c.id}" data-outcome="${o}" data-key="${action}-${c.id}-${o}"${actorWhy ? disabledIf(true, actorWhy) : ""}>${label}</button>`).join("");
  return `<article class="panel contract">
      <div class="contract-main">
        <div>
          <div class="contract-meta" style="margin-bottom:6px">${meta.join("")}</div>
          <h2 class="contract-q" id="contract-q-${c.id}">${esc(c.description)}</h2>
        </div>
        ${timeline(c)}
        <p class="muted" style="font-size:13px">After close the oracle proposes; anyone can dispute for ${windowS} s${bond != null ? ` with a ${fmtUsd(bond)} bond` : ""}. If the oracle never proposes by the hard deadline, it ends INVALID and each side gets its lock back. An unruled dispute ends as proposed and the bond is returned.</p>
      </div>
      <div class="contract-side">
        <div class="roles">
          <div class="role" role="group" aria-label="Oracle proposes">
            <span class="role-name">Oracle proposes</span>
            <div class="item-actions">${outcomes("propose", c.oracle)}</div>
          </div>
          <div class="role" role="group" aria-label="Arbiter rules">
            <span class="role-name">Arbiter rules (after a dispute)</span>
            <div class="item-actions">${outcomes("rule", ACCOUNTS.ARBITER)}</div>
          </div>
        </div>
        ${toastHtml("contract")}
        <div class="positions">
          <h3 style="margin-bottom:6px">Positions</h3>
          ${positionsTable(c)}
        </div>
      </div>
    </article>`;
}

function positionsTable(c) {
  const list = state.snapshot.positions.filter((p) => p.contract === c.id);
  if (!list.length) {
    return isAdmin() ? '<p class="empty">No positions yet. One opens when a requester accepts a quote.</p>'
      : '<p class="empty">You hold no positions in this contract. Other parties\' fills stay private.</p>';
  }
  // Payouts come from the PositionSettled events this viewer was sent (the engine names both holders there).
  const settled = new Map(eventsNamed("PositionSettled").map((x) => [x.data.position, x.data]));
  const line = (text) => `<span class="muted" style="display:block">${text}</span>`;
  const holder = (id, lock, paid) => (id == null ? sealedMark("counterparty sealed until settlement") : `<b>${esc(name(id))}</b>`)
    + line(`locks ${fmtUsd(lock)}`) + (paid != null ? line(`paid ${fmtUsd(paid)}`) : "");
  const rows = list.map((p) => {
    const pay = settled.get(p.id);
    return `<tr style="vertical-align:top">
        <td><b>#${p.id}</b>${line(`${qty(p.qty)} shares`)}${p.settled ? badge("Settled", "b-good") : badge("Escrowed", "b-live")}</td>
        <td>${holder(p.yes_holder, p.yes_lock, pay?.yes_payout)}</td>
        <td>${holder(p.no_holder, p.no_lock, pay?.no_payout)}</td>
      </tr>`;
  }).join("");
  return `<div style="overflow-x:auto"><table>
      <thead><tr><th scope="col">Position</th><th scope="col">YES side</th><th scope="col">NO side</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
}

// ---- Trace: the command log ------------------------------------------------------------------

const MONEY_EVENTS = ["Deposited", "Withdrawn", "QuoteFilled", "PositionSettled", "Disputed", "Ruled", "DisputeBondReturned"];
const FILTERS = [["all", "All"], ["rejections", "Rejections"], ["money", "Money"], ["clock", "Clock"]];
const UNCONSUMED = ["Duplicate", "NonceGap"]; // rejections that consume no nonce

const evName = (ev) => variant(ev.event);
const evData = (ev) => (typeof ev.event === "string" ? {} : ev.event[variant(ev.event)] ?? {});
const rejectionOf = (ev) => ev.event?.CommandRejected?.reason ?? null;
const isRejected = (e) => e.events.some((ev) => rejectionOf(ev) != null);
const audienceText = (ev) => (ev.audience === "Public" ? "Public" : `→ ${name(ev.audience?.Account)}`);
const audBadge = (ev) => `<span class="aud${ev.audience === "Public" ? "" : " aud-acct"}">${esc(audienceText(ev))}</span>`;
const plainRef = (kind, id) => `#${esc(id)}`;

/** Best-effort formatting: an event or action of an unexpected shape falls back to its raw fields. */
function partsOr(fn, data) {
  try {
    return fn();
  } catch {
    if (!data || typeof data !== "object") return [];
    return Object.entries(data).map(([k, v]) => `${esc(k)} ${esc(typeof v === "object" ? JSON.stringify(v) : v)}`);
  }
}

/** A command's fields in short form, e.g. "req #7 · 0.60 × 1,000 · exp t+10.000 s". Plain text, escaped. */
function actionParts(kind, a) {
  return partsOr(() => {
    switch (kind) {
      case "Deposit": return [`${fmtUsd(a.amount)} to ${esc(name(a.to))}`];
      case "Withdraw": return [fmtUsd(a.amount)];
      case "ListContract": return [`#${esc(a.id)}`, `closes ${fmtT(a.trading_close)}`, `hard deadline ${fmtT(a.resolution_deadline)}`];
      case "SubmitRequest": return [...a.legs.map((l) => `Buy ${sideName(l.side)} × ${qty(l.qty)} · limit ${fmtPrice(l.limit_price)}`), `due ${fmtT(a.response_deadline)}`];
      case "CancelRequest": case "Reject": return [`req #${esc(a.request)}`];
      case "SubmitQuote": return [`req #${esc(a.request)}`, `${fmtPrice(a.price)} × ${qty(a.size)}`, `exp ${fmtT(a.expires_at)}`];
      case "CancelQuote": return [`quote #${esc(a.quote)}`];
      case "Accept": return [`req #${esc(a.request)}`, ...a.picks.map((p) => `#${esc(p.quote)} at ${fmtPrice(p.price)}`)];
      case "ProposeOutcome": case "Rule": return [`#${esc(a.contract)}`, esc(outcomeName(a.outcome))];
      case "Dispute": return [`#${esc(a.contract)}`];
      default: throw new Error("unknown action");
    }
  }, a);
}

/** An event's fields in short form. `ref` renders an id: a link in lists, plain text inside a row button. */
function eventParts(ev, ref) {
  const v = evName(ev), d = evData(ev);
  return partsOr(() => {
    switch (v) {
      case "Initialized": return [];
      case "CommandRejected": return [esc(d.reason)];
      case "Deposited": return [`${fmtUsd(d.amount)} to ${esc(name(d.account))}`];
      case "Withdrawn": return [`${fmtUsd(d.amount)} from ${esc(name(d.account))}`];
      case "ContractListed": case "ContractClosed": return [ref("contract", d.contract)];
      case "RequestOpened": return [ref("request", d.request), `Buy ${sideName(d.side)} × ${qty(d.qty)} on ${ref("contract", d.contract)}`, `due ${fmtT(d.response_deadline)}`];
      case "RequestCancelled": case "RequestExpired": return [ref("request", d.request)];
      case "RequestPresented": return [ref("request", d.request), ...d.picks.map((p) => `pick ${ref("quote", p.quote)} at ${fmtPrice(p.price)}`), `accept by ${fmtT(d.accept_by)}`];
      case "RequestRejected": return [ref("request", d.request), esc(d.cause)];
      case "RequestFilled": return [ref("request", d.request), `position ${d.positions.map((p) => `#${esc(p)}`).join(", ")}`];
      case "QuoteSubmitted": return [ref("quote", d.quote), `on ${ref("request", d.request)} at ${fmtPrice(d.price)}`, `expires ${fmtT(d.expires_at)}`];
      case "QuoteReplaced": return [`${ref("quote", d.old)} → ${ref("quote", d.new)}`];
      case "QuoteCancelled": case "QuoteExpired": case "QuoteLost": case "QuoteSelected": case "QuoteReleased": return [ref("quote", d.quote)];
      case "QuoteFilled": return [ref("quote", d.quote), `position #${esc(d.position)}`];
      case "OutcomeProposed": return [ref("contract", d.contract), esc(outcomeName(d.outcome)), `dispute until ${fmtT(d.dispute_until)}`];
      case "Disputed": return [ref("contract", d.contract), `by ${esc(name(d.disputer))}`];
      case "Ruled": return [ref("contract", d.contract), esc(outcomeName(d.outcome)), d.bond_returned ? "bond returned" : "bond forfeited"];
      case "ContractFinalized": return [ref("contract", d.contract), esc(outcomeName(d.outcome))];
      case "PositionSettled": return [`#${esc(d.position)}`, `${esc(name(d.yes_holder))} paid ${fmtUsd(d.yes_payout)}`, `${esc(name(d.no_holder))} paid ${fmtUsd(d.no_payout)}`];
      case "DisputeBondReturned": return [ref("contract", d.contract), `${fmtUsd(d.amount)} to ${esc(name(d.disputer))}`];
      default: throw new Error("unknown event");
    }
  }, d);
}

/** The row's one-line summary: who, what kind, and the command's fields (or, if hidden, its first event). */
function rowSummary(e) {
  const user = e.command?.User;
  if (user) {
    const kind = variant(user.action);
    return `<b>${esc(name(user.actor))}</b> ${[esc(kind), ...actionParts(kind, user.action[kind])].join(" · ")}`;
  }
  if (e.kind === "genesis") {
    const c = e.command?.Genesis?.config;
    return `<b>system</b> genesis${c ? ` · ${esc(c.reservation)}, ${esc(c.selection)}` : ""}`;
  }
  if (e.kind === "tick" || e.kind === "resume") {
    const names = [...new Set(e.events.map(evName))];
    return `<b>system</b> ${esc(e.kind)} · ${names.length ? esc(names.join(", ")) : "no events"}`;
  }
  // Another party's command: only the events this viewer was sent, as the engine addressed them.
  const first = e.events[0];
  if (!first) return "<b>hidden</b>";
  const parts = eventParts(first, plainRef);
  const more = e.events.length > 1 ? ` (+${e.events.length - 1} more)` : "";
  return `<b>${esc(audienceText(first))}</b> ${esc(evName(first))}${parts.length ? ` ${parts.join(", ")}` : ""}${more}`;
}

/** The nonce column: the nonce, "(n)" when the engine consumed nothing, a lock when the command is hidden. */
function nonceCell(e) {
  if (e.kind === "hidden") {
    return `<span class="nonce" title="Command hidden in this view: only its events show">${icon("lock")}<span class="sr-only">command hidden</span></span>`;
  }
  if (e.nonce == null) return '<span class="nonce"></span>';
  const unused = e.events.some((ev) => UNCONSUMED.includes(rejectionOf(ev)));
  return `<span class="nonce" title="Nonce ${esc(e.nonce)}${unused ? ", not consumed" : ""}"><span class="sr-only">nonce </span>${unused ? `(${esc(e.nonce)})` : esc(e.nonce)}</span>`;
}

function passesFilter(e) {
  switch (ui.filter) {
    case "rejections": return isRejected(e);
    case "money": return e.events.some((ev) => MONEY_EVENTS.includes(evName(ev)));
    case "clock": return e.kind === "tick" || e.kind === "resume";
    default: return true;
  }
}

function traceRow(e, fresh, open) {
  const rejected = isRejected(e);
  const cls = ["row", fresh && "is-new", open && "is-open", rejected && "is-rejected"].filter(Boolean).join(" ");
  const n = e.events.length;
  const head = `<button class="row-head" type="button" data-action="toggle-row" data-seq="${e.seq}" data-key="row-${e.seq}" aria-expanded="${open}"${open ? ` aria-controls="row-ev-${e.seq}"` : ""}>`
    + `<span class="seq"><span class="sr-only">seq </span>${e.seq}</span><span class="t">${clockText(e.time)}</span>${nonceCell(e)}`
    + `<span class="what">${rowSummary(e)}</span><span class="count" title="${n} event${n === 1 ? "" : "s"}"><span class="sr-only">, events: </span>${n}</span></button>`;
  if (!open) return { key: `r${e.seq}`, cls, inner: head };
  const items = e.events.map((ev, i) => {
    const rej = rejectionOf(ev) != null;
    const parts = eventParts(ev, (kind, id) => idlink(kind, id, `#${id}`, `t${e.seq}e${i}`));
    return `<li><span class="ev${rej ? " rej" : ""}">${esc(evName(ev))}</span>${parts.length ? `<span${rej ? ' class="ev rej"' : ""}>${parts.join(", ")}</span>` : ""}${audBadge(ev)}</li>`;
  }).join("");
  return { key: `r${e.seq}`, cls, inner: `${head}<ul class="row-events" id="row-ev-${e.seq}">${items || '<li class="muted">No events.</li>'}</ul>` };
}

/**
 * Keyed update of a list: rows whose markup didn't change keep their DOM node, so the log doesn't
 * flicker, keeps its scroll position, and a screen reader hears only the rows that are new.
 */
function patchList(box, items) {
  const old = new Map([...box.children].map((node) => [node.dataset.k, node]));
  const make = (it) => {
    const node = document.createElement("div");
    node.dataset.k = it.key;
    node.innerHTML = it.inner;
    node.patched = it.inner;
    if (it.hidden) node.setAttribute("aria-hidden", "true");
    return node;
  };
  let at = box.firstElementChild;
  for (const it of items) {
    let node = old.get(it.key);
    old.delete(it.key);
    if (!node) node = make(it);
    else if (node.patched !== it.inner) {
      const fresh = make(it);
      if (node === at) at = fresh;
      node.replaceWith(fresh);
      node = fresh;
    }
    if (node.className !== it.cls) node.className = it.cls;
    if (node === at) at = at.nextElementSibling;
    else box.insertBefore(node, at);
  }
  for (const node of old.values()) node.remove();
}

function renderTrace() {
  const head = document.getElementById("trace-head");
  const sub = isAdmin() ? "Every command and event" : `What ${name(viewerId())} can see`;
  const headHtml = `<div class="trace-head-top"><h2 id="trace-h">Trace</h2><span class="muted" style="font-size:13px">${esc(sub)}</span></div>
      <div class="filters" role="group" aria-label="Filter the trace">${FILTERS.map(([f, label]) =>
        `<button type="button" id="filter-${f}" data-action="filter" data-filter="${f}" aria-pressed="${ui.filter === f}">${label}</button>`).join("")}</div>`;
  if (head.patched !== headHtml) {
    head.innerHTML = headHtml;
    head.patched = headHtml;
  }

  const fresh = newSeqs();
  const last = state.trace[state.trace.length - 1];
  // Rejections open by default (their reason is the point), and so does the newest row.
  const rows = state.trace.filter(passesFilter).map((e) => {
    const open = ui.rows.get(e.seq) ?? (isRejected(e) || (e === last && fresh.has(e.seq)));
    return traceRow(e, fresh.has(e.seq), open);
  });
  const cols = { key: "cols", cls: "log-cols", hidden: true, inner: "<span>seq</span><span>time</span><span>nonce</span><span>command</span><span>events</span>" };
  const none = { rejections: "No rejections yet.", money: "No money has moved yet.", clock: "No clock ticks yet." }[ui.filter] ?? "No rows yet.";
  const empty = { key: "empty", cls: "empty", inner: `<p style="padding:10px 16px">${none}</p>` };
  patchList(document.getElementById("log"), [cols, ...rows, ...(rows.length ? [] : [empty])]);
}

/** After a render: keep the newest row in view, unless the presenter scrolled up to read. */
function followLog() {
  const log = document.getElementById("log");
  if (ui.logPinned) log.scrollTop = log.scrollHeight;
}

/** Opens a row (from the inspector), clearing a filter that hides it, and moves focus to it. */
function revealRow(seq) {
  ui.rows.set(seq, true);
  const e = state.trace.find((x) => x.seq === seq);
  if (e && !passesFilter(e)) ui.filter = "all";
  ui.logPinned = false;
  render();
  const row = document.querySelector(`[data-key="row-${seq}"]`);
  row?.scrollIntoView({ block: "nearest" });
  row?.focus({ preventScroll: true });
}

// ---- Inspector -------------------------------------------------------------------------------

const REF_FIELDS = ["request", "quote", "contract", "old", "new", "id"];
const REF_KIND = { request: "request", quote: "quote", old: "quote", new: "quote", contract: "contract" };
const KIND_TITLE = { request: "Request", quote: "Quote", contract: "Contract" };

/** Whether a command or event mentions the id in a field named request, quote, contract, old, new or id. */
function refers(v, id) {
  if (Array.isArray(v)) return v.some((x) => refers(x, id));
  if (!v || typeof v !== "object") return false;
  return Object.entries(v).some(([k, x]) => (REF_FIELDS.includes(k) && x === id) || refers(x, id));
}

/** Every trace entry, in this view, whose command or events reference the object. */
function historyOf(sel) {
  if (!sel) return [];
  return state.trace.filter((e) => refers(e.command, sel.id) || e.events.some((ev) => refers(ev.event, sel.id)));
}

/** The object's state in this view's snapshot: null when the viewer may not see it. */
function currentState(sel) {
  const s = state.snapshot;
  if (sel.kind === "request") {
    const r = s.requests.find((x) => x.id === sel.id);
    return r?.state ? variant(r.state) : r?.public_state === "open" ? "Open" : null;
  }
  if (sel.kind === "quote") return s.quotes.find((q) => q.id === sel.id)?.state ?? null;
  const c = s.contracts.find((x) => x.id === sel.id);
  return c ? variant(c.state) : null;
}

function inspectorFacts(sel) {
  const s = state.snapshot, where = "insp";
  const sealed = sealedMark("sealed");
  if (sel.kind === "request") {
    const r = s.requests.find((x) => x.id === sel.id);
    if (!r) return { badge: "", facts: "<span>Not in this view.</span>" };
    const facts = [`<span>Requester ${r.requester != null ? `<b>${esc(name(r.requester))}</b>` : sealed}</span>`];
    for (const leg of r.legs) {
      facts.push(`<span>Buy <b>${sideName(leg.side)}</b> × <b>${qty(leg.qty)}</b> on ${idlink("contract", leg.contract, `#${leg.contract}`, where)}</span>`);
      facts.push(`<span>Limit ${leg.limit_price != null ? `<b>${fmtPrice(leg.limit_price)}</b>` : sealed}</span>`);
    }
    facts.push(`<span>Quotes due <b>${fmtT(r.response_deadline)}</b></span>`);
    if (r.state?.Presented) facts.push(`<span>Accept by <b>${fmtT(r.state.Presented.accept_by)}</b></span>`);
    for (const p of r.picks) facts.push(`<span>Pick ${idlink("quote", p.quote, `#${p.quote}`, where)} at <b>${fmtPrice(p.price)}</b></span>`);
    if (r.state?.Rejected) facts.push(`<span>Cause <b>${esc(r.state.Rejected)}</b></span>`);
    const b = r.state ? badge(variant(r.state)) : badge(r.public_state, r.public_state === "open" ? "b-live" : "b-gone");
    return { badge: b, facts: facts.join("") };
  }
  if (sel.kind === "quote") {
    const q = s.quotes.find((x) => x.id === sel.id);
    if (!q) return { badge: "", facts: sealedMark("sealed: only its market maker and admin see this quote") };
    return {
      badge: badge(q.state),
      facts: `<span>Market maker <b>${esc(name(q.mm))}</b></span><span>On ${idlink("request", q.request, `request #${q.request}`, where)}</span>`
        + `<span>Sells at <b>${fmtPrice(q.price)}</b> × <b>${qty(q.size)}</b></span><span>${q.state === "Selected" ? "Firm until" : "Expires"} <b>${fmtT(q.expires_at)}</b></span>`,
    };
  }
  const c = s.contracts.find((x) => x.id === sel.id);
  if (!c) return { badge: "", facts: "<span>Not in this view.</span>" };
  const st = variant(c.state);
  const facts = [`<span>Trading closes <b>${fmtT(c.trading_close)}</b></span>`, `<span>Hard deadline <b>${fmtT(c.resolution_deadline)}</b></span>`];
  if (st === "Proposed") facts.push(`<span>Proposed <b>${esc(outcomeName(c.state.Proposed.outcome))}</b>, dispute until <b>${fmtT(c.state.Proposed.dispute_until)}</b></span>`);
  if (st === "Disputed") facts.push(`<span>Proposed <b>${esc(outcomeName(c.state.Disputed.proposed))}</b>, disputed by <b>${esc(name(c.dispute?.disputer))}</b></span>`);
  if (st === "Final") facts.push(`<span>Outcome <b>${esc(outcomeName(c.state.Final))}</b></span>`);
  return { badge: badge(st), facts: facts.join("") };
}

/** One history line: the seq (opens its trace row), who did what, and each event with its ids. */
function historyItem(e, sel) {
  const user = e.command?.User;
  const who = user ? name(user.actor) : e.kind === "hidden" ? (e.events[0] ? audienceText(e.events[0]) : "hidden") : "system";
  const what = user ? variant(user.action) : e.kind === "hidden" ? "" : e.kind;
  const ref = (field, id) => (id === sel.id ? `#${esc(id)}` : idlink(REF_KIND[field], id, `#${id}`, `insp${e.seq}`));
  const evs = e.events.map((ev) => {
    const d = evData(ev), v = evName(ev);
    if (v === "QuoteReplaced") return `${esc(v)} ${ref("old", d.old)} → ${ref("new", d.new)}`;
    const field = ["quote", "request", "contract"].find((f) => typeof d[f] === "number");
    return `<span${rejectionOf(ev) ? ' class="check-bad"' : ""}>${esc(v)}${field ? ` ${ref(field, d[field])}` : ""}${rejectionOf(ev) ? ` (${esc(rejectionOf(ev))})` : ""}</span>`;
  }).join(", ");
  return `<li><button class="idlink" type="button" data-action="reveal-row" data-seq="${e.seq}" data-key="insp-seq-${e.seq}">seq ${e.seq}</button> <b>${esc(who)}</b>${what ? ` ${esc(what)}` : ""}${evs ? ` → ${evs}` : ""}</li>`;
}

function renderInspector() {
  const el = document.getElementById("inspector");
  if (!selected) {
    el.innerHTML = '<h2 id="insp-h" tabindex="-1">Inspector</h2><p class="empty">Click any request, quote or contract id to trace it.</p>';
    return;
  }
  const { badge: b, facts } = inspectorFacts(selected);
  const items = historyOf(selected).map((e) => historyItem(e, selected)).join("");
  el.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
      <h2 id="insp-h" tabindex="-1">${KIND_TITLE[selected.kind] ?? "Object"} #${esc(selected.id)}</h2>
      <span style="display:flex;gap:8px;align-items:center">${b}<button class="btn btn-quiet btn-sm" type="button" id="insp-clear" data-action="deselect">Clear</button></span>
    </div>
    <div class="item-facts">${facts}</div>
    ${items ? `<ol>${items}</ol>` : `<p class="empty">Nothing in this view's trace mentions it.</p>`}`;
}

// ---- Ledger ----------------------------------------------------------------------------------

const LEDGER_ORDER = ["requester", "market_maker"];
const roleText = (role) => (role === "market_maker" ? "market maker" : role);
const sumOf = (b) => b.free + b.reserved + b.escrowed; // display only: the row's total

/** A cell's change since the last command: display diff of two engine integers. */
function deltaHtml(now, before) {
  if (before == null || now === before) return "";
  const d = now - before;
  return `<span class="delta ${d > 0 ? "up" : "down"}">${d > 0 ? "+" : ""}${fmtUsd(d)}</span>`;
}

function renderLedger() {
  const s = state.snapshot, base = ui.ledgerBase;
  const rank = (a) => { const i = LEDGER_ORDER.indexOf(a.role); return i < 0 ? LEDGER_ORDER.length : i; };
  const sorted = [...s.accounts].sort((a, b) => rank(a) - rank(b));
  // System accounts that hold nothing, and held nothing before the last command, share one row
  // (as in the mockup); one that holds money, like the treasury after a forfeited bond, gets its own.
  const idle = sorted.filter((a) => rank(a) === LEDGER_ORDER.length && sumOf(a.balance) === 0
    && sumOf(base?.balances.get(a.id) ?? a.balance) === 0);
  const grouped = idle.length > 1 ? new Set(idle) : new Set();
  const rows = sorted.filter((a) => !grouped.has(a)).map((a) => {
    const b = a.balance, was = base?.balances.get(a.id);
    const cells = [[b.free, was?.free], [b.reserved, was?.reserved], [b.escrowed, was?.escrowed], [sumOf(b), was && sumOf(was)]];
    const changed = was && cells.some(([now, before]) => now !== before);
    return `<tr${changed ? ' class="changed"' : ""}>
        <td><span class="who">${esc(a.name)}</span><span class="role">${esc(roleText(a.role))}</span></td>
        ${cells.map(([now, before]) => `<td>${fmtUsd(now)}${deltaHtml(now, before)}</td>`).join("")}
        <td>${sumOf(b) > 0 ? splitBar(b) : ""}</td>
      </tr>`;
  }).join("") + (grouped.size ? `<tr>
        <td><span class="who">${esc([...grouped].map((a) => a.name).join(", "))}</span><span class="role">system accounts</span></td>
        ${`<td>${fmtUsd(0)}</td>`.repeat(4)}<td></td>
      </tr>` : "");
  const foot = s.total != null
    ? `<tfoot><tr><td colspan="4">Ledger total</td><td>${fmtUsd(s.total)}${deltaHtml(s.total, base?.total)}</td><td class="muted" style="text-align:left;font-weight:400">changes only on Deposit/Withdraw (I1)</td></tr></tfoot>`
    : "";
  const inv = s.invariants.ok
    ? `${badge("I1–I5 hold", "b-good")} <span class="muted">checked after every command</span>`
    : `${badge("I1–I5 broken", "b-bad")} <span class="check-bad">${esc(s.invariants.error ?? "")}</span>`;
  const r = ui.replay;
  const hash = (h) => String(h).slice(0, 8);
  const text = !r ? ""
    : r.matches ? `Replayed ${r.commands} commands → hash ${hash(r.replayed)} = live ${hash(r.live)} ✓`
    : `Replayed ${r.commands} commands → hash ${hash(r.replayed)} ≠ live ${hash(r.live)}: mismatch ✗`;
  document.getElementById("ledger-table").innerHTML = `<table>
      <thead><tr><th scope="col">Account</th><th scope="col">Free</th><th scope="col">Reserved</th><th scope="col">Escrowed</th><th scope="col">Total</th><th scope="col" class="barcol">Split</th></tr></thead>
      <tbody>${rows}</tbody>
      ${foot}
    </table>`;
  document.getElementById("ledger-inv").innerHTML = inv;
  // The live region is never rebuilt: only its text and class change, and only when they differ.
  const live = document.getElementById("replay-result");
  const cls = !r ? "" : r.matches ? "check-ok" : "check-bad";
  if (live.textContent !== text) live.textContent = text;
  if (live.className !== cls) live.className = cls;
  document.getElementById("ledger-note").hidden = s.total != null;
}

// ---- Deliverables: D1 state machines -----------------------------------------------------------

// Transcribed from engine.md §6.1–6.3: every state, every edge, each edge's trigger and who fires it.
// Node: [key, x, y, width, text, terminal]. Edge: [key, path, labels as [x, y, text, anchor?]].

// Which edge each event is, per kind: [edge, the state it enters].
const REQUEST_STEPS = {
  RequestOpened: ["start", "Open"], RequestCancelled: ["cancel", "Cancelled"], RequestExpired: ["expire", "Expired"],
  RequestPresented: ["present", "Presented"], RequestFilled: ["accept", "Filled"], RequestRejected: ["reject", "Rejected"],
};
const QUOTE_STEPS = {
  QuoteSubmitted: ["start", "Active"], QuoteReplaced: ["replace", "Replaced"], QuoteCancelled: ["cancel", "Cancelled"],
  QuoteExpired: ["expire", "Expired"], QuoteLost: ["lose", "Lost"], QuoteSelected: ["select", "Selected"],
  QuoteFilled: ["fill", "Filled"], QuoteReleased: ["release", "Released"],
};

/** The contract edge an event took, which depends on the state it left (both Finals are "Final"). */
function contractStep(v, at, entry) {
  switch (v) {
    case "ContractListed": return ["start", "Trading"];
    case "ContractClosed": return ["close", "Closed"];
    case "OutcomeProposed": return entry.kind === "resume" || at === "Proposed" ? ["resume", "Proposed"] : ["propose", "Proposed"];
    case "Disputed": return ["dispute", "Disputed"];
    case "Ruled": return ["rule", "FinalB"];
    case "ContractFinalized":
      if (at === "Proposed") return ["window", "FinalA"];
      if (at === "Disputed") return ["hardDisputed", "FinalB"];
      if (at === "Closed") return ["hardClosed", "FinalA"];
      return null; // after Ruled (same command), or from a state this view never saw
    default: return null;
  }
}

/** The selected object's transitions, from the state-changing events in its history. */
function transitionsOf(sel) {
  const out = [];
  let at = null;
  for (const e of historyOf(sel)) {
    for (const ev of e.events) {
      const v = evName(ev), d = evData(ev);
      let step = null;
      if (sel.kind === "request" && d.request === sel.id) step = REQUEST_STEPS[v];
      else if (sel.kind === "quote" && (v === "QuoteReplaced" ? d.old : d.quote) === sel.id) step = QUOTE_STEPS[v];
      else if (sel.kind === "contract" && d.contract === sel.id) step = contractStep(v, at, e);
      if (step) {
        out.push({ edge: step[0], to: step[1], seq: e.seq });
        at = step[1];
      }
    }
  }
  return out;
}

/** What the selected object lights in its diagram: its current node, and the edge it took last. */
function litFor(m) {
  if (!selected || selected.kind !== m.kind) return null;
  const now = currentState(selected);
  const last = transitionsOf(selected).at(-1);
  const node = (key) => (key === "FinalA" || key === "FinalB" ? "Final" : key);
  const edge = last && now && node(last.to) === now ? last.edge : null;
  let nodes = [];
  if (now === "Final") nodes = edge ? [last.to] : ["FinalA", "FinalB"];
  else if (now) nodes = [now];
  return { now, nodes: new Set(nodes), edge };
}

function machineHtml(m) {
  const lit = litFor(m);
  const p = `sm-${m.kind}`;
  const labelOf = (key) => m.edges.find(([k]) => k === key)?.[2].map((l) => l[2]).join(" ") ?? "";
  const edges = m.edges.map(([key, d]) => `<path class="sm-edge${lit?.edge === key ? " is-last" : ""}" d="${d}" marker-end="url(#${p}-ah${lit?.edge === key ? "-last" : ""})"/>`).join("");
  const labels = m.edges.flatMap(([key, , ls]) => ls.map(([x, y, t, anchor]) =>
    `<text class="sm-label${lit?.edge === key ? " is-last" : ""}" x="${x}" y="${y}"${anchor ? ` text-anchor="${anchor}"` : ""}>${esc(t)}</text>`)).join("");
  const nodes = m.nodes.map(([key, x, y, w, t, terminal]) => {
    const cls = ["sm-node", terminal && "is-terminal", lit?.nodes.has(key) && "is-current"].filter(Boolean).join(" ");
    return `<g class="${cls}"><rect x="${x}" y="${y}" width="${w}" height="32" rx="6"/><text x="${x + w / 2}" y="${y + 21}" text-anchor="middle">${esc(t)}</text></g>`;
  }).join("");
  const marker = (id, fill, size) => `<marker id="${id}" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="${size}" markerHeight="${size}" orient="auto"><path d="M0 0L8 4L0 8z" style="fill:var(${fill})"/></marker>`;
  const sel = selected?.kind === m.kind ? selected : null;
  const status = !sel ? `select a ${m.kind} to light it`
    : lit.now ? `#${sel.id} is ${lit.now}` : `#${sel.id}: its state is sealed in this view`;
  const aria = [`${m.title} state machine.`];
  if (sel) aria.push(lit.now ? `#${sel.id} is ${lit.now}${lit.edge ? `, entered by ${labelOf(lit.edge)}` : ""}.` : `#${sel.id}'s state is sealed in this view.`);
  return `<div class="machine">
      <h3>${m.title} <span class="muted" style="font-weight:400;font-size:13px">${esc(status)}</span></h3>
      <svg viewBox="${m.view}" role="img" aria-label="${esc(aria.join(" "))}"><defs>${marker(`${p}-ah`, "--ink-3", 7)}${marker(`${p}-ah-last`, "--accent", 6)}</defs>
        <circle class="sm-start" cx="${m.start[0]}" cy="${m.start[1]}" r="5"/>${edges}${labels}${nodes}</svg>
      <p class="muted caption">${esc(m.caption)}</p>
    </div>`;
}

function multiLegPanel() {
  // engine.md §8: the "leg 2 of 3" table as three steps, and the five atomicity rules.
  return `<p style="margin-bottom:10px"><span class="not-built">Designed, not built (P6)</span> <span class="muted">The engine rejects more than one leg today: a request with two or more legs is CommandRejected (Unsupported). This is the design for "leg 2 of 3 fails after leg 1 matched".</span></p>
    <div class="steps3">
      <div class="item"><div class="item-head"><span class="id">1. Before the deadline</span></div><p style="font-size:13px">Leg 1: MM-A's quote is Active and holds. Leg 2: no quote. Leg 3: MM-C's quote is Active and holds. The request is Open. Nothing provisional is escrowed.</p></div>
      <div class="item"><div class="item-head"><span class="id">2. The deadline fires</span></div><p style="font-size:13px">Leg 2 has no eligible quote, so the whole request is Expired. MM-A's, MM-C's and the requester's holds are all released in that one command.</p></div>
      <div class="item"><div class="item-head"><span class="id">3. Alternative path</span></div><p style="font-size:13px">Every leg has an eligible quote and the request is Presented. MM-B's cancel on leg 2 is rejected (InvalidState) because selected quotes are firm. Accept fills all three legs in one command; Reject or a lapse releases all of them.</p></div>
    </div>
    <ol class="rules">
      <li>One hold per request covers all legs, and one hold per quote: no per-leg partial commitment.</li>
      <li>Selection is all-or-nothing: every leg needs an eligible quote, or the request expires and every hold is released.</li>
      <li>Acceptance is one command: all legs are validated first, then all escrows applied.</li>
      <li>A presented request stays whole: selected quotes are firm, so no leg drops out inside the window.</li>
      <li>Every leg's contract outlives the request: the trading-close guard runs per leg.</li>
    </ol>`;
}

  ["d3", "D3 Failure modes", d3Panel],
  ["d4", "D4 Resolution", d4Panel],
  ["d5", "D5 Quote lifetime", d5Panel],
];

function renderPanels() {
  const el = document.getElementById("panels");
  const tabs = TABS.map(([k, label]) =>
    `<button class="tab" role="tab" type="button" id="tab-${k}" data-action="tab" data-tab="${k}" aria-selected="${ui.tab === k}" aria-controls="t-${k}" tabindex="${ui.tab === k ? 0 : -1}">${label}</button>`).join("");
  // Only the open tab is built; the others stay as empty, hidden targets for aria-controls.
  const panels = TABS.map(([k, , body]) =>
    `<div class="tabpanel" role="tabpanel" id="t-${k}" aria-labelledby="tab-${k}" tabindex="0"${ui.tab === k ? `>${body()}` : " hidden>"}</div>`).join("");
  el.innerHTML = `<div class="tabs" role="tablist" aria-label="Deliverables">${tabs}</div>${panels}`;
}

// ---- Errors ----------------------------------------------------------------------------------

/** A dismissible banner with the engine's sentence. Never alert(). Cleared by the next good response. */
function showError(msg) {
  const el = document.getElementById("errors");
  el.innerHTML = `<div class="toast" role="alert" style="display:flex;align-items:center;justify-content:space-between;gap:12px">
      <span>${esc(msg)}</span>
      <button class="btn btn-quiet btn-sm" type="button" id="error-dismiss" data-action="dismiss-error">Dismiss</button>
    </div>`;
  el.hidden = false;
}
function clearError() {
  const el = document.getElementById("errors");
  el.hidden = true;
  el.innerHTML = "";
}

// ---- Commands --------------------------------------------------------------------------------

/** A manual command as `actor`. Mid-preset, the engine takes the script over. */
function act(actor, action) {
  stopPlay();
  return send({ op: "act", actor, action });
}

function reset(mode) {
  stopPlay();
  selected = null;
  ui.drafts.clear();
  ui.errors.clear();
  ui.rows.clear();
  ui.replay = null;
  ui.logPinned = true;
  clearToasts();
  if (!send({ op: "reset", mode })) renderTopBar(); // a refused reset: put the picker back
}

function startPlay() {
  if (playing) return;
  playing = setInterval(playStep, PLAY_MS);
  playStep();
}
function playStep() {
  const p = state?.preset;
  if (!p || p.finished || p.taken_over) return stopPlay();
  const out = send({ op: "step" });
  if (!out?.preset || out.preset.finished || out.preset.taken_over) stopPlay();
}
function stopPlay() {
  if (!playing) return;
  clearInterval(playing);
  playing = null;
  if (state) render(); // through render(), so keyboard focus stays on Pause (or Reset)
}

function toggleTheme() {
  // With no explicit choice the page shows the OS theme, so flip from what is showing.
  const shown = root.dataset.theme ?? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  root.dataset.theme = shown === "dark" ? "light" : "dark";
  try { localStorage.setItem("rfq-dashboard-theme", root.dataset.theme); } catch { /* storage blocked */ }
}

// ---- Events: one delegated listener per kind, so re-rendering re-binds nothing --------------

app.addEventListener("click", (e) => {
  const b = e.target.closest("[data-action]");
  if (!b || b.disabled || !app.contains(b)) return;
  const d = b.dataset, n = (k) => Number(d[k]);
  if (d.action === "dismiss-error") return clearError();
  if (d.action === "theme") return toggleTheme();
  if (!state) return;
  switch (d.action) {
    case "select": return select(d.kind, n("id"));
    case "deselect":
      selected = null;
      render();
      return document.getElementById("insp-h")?.focus(); // Clear is gone: keep focus in the inspector
    case "toggle-row": ui.rows.set(n("seq"), b.getAttribute("aria-expanded") !== "true"); return render();
    case "reveal-row": return revealRow(n("seq"));
    case "filter": ui.filter = d.filter; ui.logPinned = true; return render();
    case "tab": ui.tab = d.tab; return render();
    case "replay": stopPlay(); return send({ op: "replay_check" });
    case "run-preset": return reset(d.preset);
    case "step": stopPlay(); return send({ op: "step" });
    case "play": return playing ? stopPlay() : startPlay();
    case "run-all": stopPlay(); return send({ op: "run_all" });
    case "reset": return reset(state.mode);
    case "take-over": stopPlay(); return send({ op: "take_over" });
    case "advance": stopPlay(); return send({ op: "advance", ms: n("ms") });
    case "next-timer": stopPlay(); return send({ op: "next_timer" });
    case "view": return send({ op: "view", viewer: d.viewer === "admin" ? "admin" : { account: n("viewer") } });
    case "toggle":
      if (ui.open.has(d.target)) ui.open.delete(d.target); else ui.open.add(d.target);
      render();
      document.getElementById(`${d.target}-qty`)?.focus();
      return;
    case "cancel-request": return act(n("actor"), { CancelRequest: { request: n("request") } });
    case "accept": {
      // Accept echoes the picks exactly as the engine presented them.
      const r = state.snapshot.requests.find((x) => x.id === n("request"));
      return act(n("actor"), { Accept: { request: n("request"), picks: r?.picks ?? [] } });
    }
    case "reject": return act(n("actor"), { Reject: { request: n("request") } });
    case "cancel-quote": return act(n("actor"), { CancelQuote: { quote: n("quote") } });
    case "dispute": return act(n("actor"), { Dispute: { contract: n("contract") } });
    case "propose": return act(n("actor"), { ProposeOutcome: { contract: n("contract"), outcome: d.outcome } });
    case "rule": return act(n("actor"), { Rule: { contract: n("contract"), outcome: d.outcome } });
  }
});

app.addEventListener("submit", (e) => {
  e.preventDefault();
  if (!state) return;
  if (e.target.dataset.form === "quote") submitQuote(e.target);
  if (e.target.dataset.form === "request") submitRequest(e.target);
});

// Typing keeps a draft (re-renders rebuild the form) and clears that field's error.
app.addEventListener("input", (e) => {
  const form = e.target.closest("form[data-key]");
  if (!form || !e.target.name) return;
  const key = form.dataset.key;
  ui.drafts.set(key, { ...(ui.drafts.get(key) ?? {}), [e.target.name]: e.target.value });
  const errs = ui.errors.get(key);
  if (errs?.[e.target.name]) {
    delete errs[e.target.name];
    render();
  }
});

// Tabs follow the ARIA pattern: arrow keys, Home and End move between them.
app.addEventListener("keydown", (e) => {
  const tab = e.target.closest?.('[role="tab"]');
  if (!tab || !state) return;
  const keys = TABS.map(([k]) => k);
  const i = keys.indexOf(tab.dataset.tab);
  const to = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: keys.length - 1 }[e.key];
  if (to == null) return;
  e.preventDefault();
  ui.tab = keys[(to + keys.length) % keys.length];
  render();
  document.getElementById(`tab-${ui.tab}`)?.focus();
});

// The trace sidebar sticks right under the top bar, which wraps to two rows on narrower screens.
const topbar = document.getElementById("topbar");
const syncTopbar = () => root.style.setProperty("--topbar-h", `${topbar.offsetHeight}px`);
if (typeof ResizeObserver === "function") new ResizeObserver(syncTopbar).observe(topbar);
syncTopbar();

// The log follows new rows only while it is scrolled to the bottom.
document.getElementById("log").addEventListener("scroll", (e) => {
  const log = e.currentTarget;
  ui.logPinned = log.scrollHeight - log.scrollTop - log.clientHeight < 24;
}, { passive: true });

document.getElementById("preset").addEventListener("change", (e) => {
  if (state) reset(e.target.value);
});

try { const t = localStorage.getItem("rfq-dashboard-theme"); if (t === "dark" || t === "light") root.dataset.theme = t; } catch { /* storage blocked */ }
if (location.hash.includes("dark")) root.dataset.theme = "dark";
</script>
</body>
</html>
