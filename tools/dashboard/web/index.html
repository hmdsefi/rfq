const FILTERS = [["all", "All"], ["rejections", "Rejections"], ["money", "Money"], ["clock", "Clock"]];
const UNCONSUMED = ["Duplicate", "NonceGap"];
const evName = (ev) => variant(ev.event);
const evData = (ev) => (typeof ev.event === "string" ? {} : ev.event[variant(ev.event)] ?? {});
const rejectionOf = (ev) => ev.event?.CommandRejected?.reason ?? null;
const isRejected = (e) => e.events.some((ev) => rejectionOf(ev) != null);
const audienceText = (ev) => (ev.audience === "Public" ? "Public" : `→ ${name(ev.audience?.Account)}`);
const audBadge = (ev) => `<span class="aud${ev.audience === "Public" ? "" : " aud-acct"}">${esc(audienceText(ev))}</span>`;
const plainRef = (kind, id) => `#${esc(id)}`;

function partsOr(fn, data) {
  try {
    return fn();
  } catch {
    if (!data || typeof data !== "object") return [];
    return Object.entries(data).map(([k, v]) => `${esc(k)} ${esc(typeof v === "object" ? JSON.stringify(v) : v)}`);
  }
}

function actionParts(kind, a) {
  return partsOr(() => {
    switch (kind) {
      case "Deposit": return [`${fmtUsd(a.amount)} to ${esc(name(a.to))}`];
      case "Withdraw": return [fmtUsd(a.amount)];
      case "ListContract": return [`#${esc(a.id)}`, `closes ${esc(fmtT(a.trading_close))}`, `hard deadline ${esc(fmtT(a.resolution_deadline))}`];
      case "SubmitRequest": return [...a.legs.map((l) => `Buy ${sideName(l.side)} × ${esc(qty(l.qty))} · limit ${fmtPrice(l.limit_price)}`), `due ${esc(fmtT(a.response_deadline))}`];
      case "CancelRequest": case "Reject": return [`req #${esc(a.request)}`];
      case "SubmitQuote": return [`req #${esc(a.request)}`, `${fmtPrice(a.price)} × ${esc(qty(a.size))}`, `exp ${esc(fmtT(a.expires_at))}`];
      case "CancelQuote": return [`quote #${esc(a.quote)}`];
      case "Accept": return [`req #${esc(a.request)}`, ...a.picks.map((p) => `#${esc(p.quote)} at ${fmtPrice(p.price)}`)];
      case "ProposeOutcome": case "Rule": return [`#${esc(a.contract)}`, esc(outcomeName(a.outcome))];
      case "Dispute": return [`#${esc(a.contract)}`];
      default: throw new Error("unknown action");
    }
  }, a);
}

function eventParts(ev, ref) {
  const v = evName(ev), d = evData(ev);
  return partsOr(() => {
    switch (v) {
      case "Initialized": return [];
      case "CommandRejected": return [esc(d.reason)];
      case "Deposited": return [`${fmtUsd(d.amount)} to ${esc(name(d.account))}`];
      case "Withdrawn": return [`${fmtUsd(d.amount)} from ${esc(name(d.account))}`];
      case "ContractListed": case "ContractClosed": return [ref("contract", d.contract)];
      case "RequestOpened": return [ref("request", d.request), `Buy ${sideName(d.side)} × ${esc(qty(d.qty))} on ${ref("contract", d.contract)}`, `due ${esc(fmtT(d.response_deadline))}`];
      case "RequestCancelled": case "RequestExpired": return [ref("request", d.request)];
      case "RequestPresented": return [ref("request", d.request), ...d.picks.map((p) => `pick ${ref("quote", p.quote)} at ${fmtPrice(p.price)}`), `accept by ${esc(fmtT(d.accept_by))}`];
      case "RequestRejected": return [ref("request", d.request), esc(d.cause)];
      case "RequestFilled": return [ref("request", d.request), `position ${d.positions.map((p) => `#${esc(p)}`).join(", ")}`];
      case "QuoteSubmitted": return [ref("quote", d.quote), `on ${ref("request", d.request)} at ${fmtPrice(d.price)}`, `expires ${esc(fmtT(d.expires_at))}`];
      case "QuoteReplaced": return [`${ref("quote", d.old)} → ${ref("quote", d.new)}`];
      case "QuoteCancelled": case "QuoteExpired": case "QuoteLost": case "QuoteSelected": case "QuoteReleased": return [ref("quote", d.quote)];
      case "QuoteFilled": return [ref("quote", d.quote), `position #${esc(d.position)}`];
      case "OutcomeProposed": return [ref("contract", d.contract), esc(outcomeName(d.outcome)), `dispute until ${esc(fmtT(d.dispute_until))}`];
      case "Disputed": return [ref("contract", d.contract), `by ${esc(name(d.disputer))}`];
      case "Ruled": return [ref("contract", d.contract), esc(outcomeName(d.outcome)), d.bond_returned ? "bond returned" : "bond forfeited"];
      case "ContractFinalized": return [ref("contract", d.contract), esc(outcomeName(d.outcome))];
      case "PositionSettled": return [`#${esc(d.position)}`, `${esc(name(d.yes_holder))} paid ${fmtUsd(d.yes_payout)}`, `${esc(name(d.no_holder))} paid ${fmtUsd(d.no_payout)}`];
      case "DisputeBondReturned": return [ref("contract", d.contract), `${fmtUsd(d.amount)} to ${esc(name(d.disputer))}`];
      default: throw new Error("unknown event");
    }
  }, d);
}

const SYSTEM_KIND = { tick: "Tick", resume: "Resume", genesis: "Genesis" };

/** The row's one-line summary: who, what, and the command's fields (or, for a hidden or system batch, its events). */
function rowSummary(e) {
  const user = e.command?.User;
  if (user) {
    const kind = variant(user.action);
    return `<b>${esc(name(user.actor))}</b> ${[esc(kind), ...actionParts(kind, user.action[kind])].join(" · ")}`;
  }
  if (SYSTEM_KIND[e.kind]) {
    const names = [...new Set(e.events.map(evName))];
    const note = e.kind === "resume" ? '<span class="row-note">engine restarted or stalled</span>' : "";
    return `<b>${SYSTEM_KIND[e.kind]}</b> · ${names.length ? esc(names.join(", ")) : "no events"}${note}`;
  }
  const first = e.events[0];
  if (e.kind === "user") {
    // An origin this page sent nothing for (another client of the gateway, or a command sent before this page).
    return `<b>${esc(name(e.actor))}</b> command${first ? ` → ${esc(evName(first))}${e.events.length > 1 ? ` (+${e.events.length - 1} more)` : ""}` : ""}`;
  }
  // Another party's command: only the events this view was sent, as the engine addressed them.
  if (!first) return "<b>another party's command</b> · its balances only";
  const parts = eventParts(first, plainRef);
  const more = e.events.length > 1 ? ` (+${e.events.length - 1} more)` : "";
  return `<b>${esc(audienceText(first))}</b> ${esc(evName(first))}${parts.length ? ` ${parts.join(", ")}` : ""}${more}`;
}

function nonceCell(e) {
  if (e.kind === "hidden") return `<span class="nonce" title="Another party's command: the gateway strips its origin in this view">${icon("lock")}<span class="sr-only">command hidden</span></span>`;
  if (e.nonce == null) return '<span class="nonce"></span>';
  const unused = e.events.some((ev) => UNCONSUMED.includes(rejectionOf(ev)));
  return `<span class="nonce" title="Nonce ${esc(e.nonce)}${unused ? ", not consumed" : ""}"><span class="sr-only">nonce </span>${unused ? `(${esc(e.nonce)})` : esc(e.nonce)}</span>`;
}

function passesFilter(e) {
  switch (ui.filter) {
    case "rejections": return isRejected(e);
    case "money": return e.balances.length > 0;
    case "clock": return e.kind === "tick" || e.kind === "resume";
    default: return true;
  }
}

/** A balance row's change, bucket by bucket: display diffs of two `balances` values. */
function balanceLine(b) {
  const parts = ["free", "reserved", "escrowed"].map((k) => {
    const now = b.balance[k], before = b.before?.[k];
    const d = before == null ? null : now - before;
    return d ? `${k} <b>${fmtUsd(now)}</b> <span class="delta-inline ${d > 0 ? "up" : "down"}">(${d > 0 ? "+" : ""}${fmtUsd(d)})</span>` : before == null ? `${k} <b>${fmtUsd(now)}</b>` : "";
  }).filter(Boolean);
  return `<li class="row-bal"><span class="aud">balance</span> ${esc(name(b.account))}: ${parts.length ? parts.join(", ") : "unchanged"}</li>`;
}

function traceRow(e, fresh, open) {
  const rejected = isRejected(e);
  const cls = ["row", fresh && "is-new", open && "is-open", rejected && "is-rejected", e.kind === "resume" && "is-resume"].filter(Boolean).join(" ");
  const n = e.events.length;
  const head = `<button class="row-head" type="button" data-action="toggle-row" data-row="${esc(e.key)}" data-key="row-${esc(e.key)}" aria-expanded="${open}"${open ? ` aria-controls="row-ev-${esc(e.key)}"` : ""}>`
    + `<span class="seq"><span class="sr-only">seq </span>${e.seq}</span><span class="t">${esc(fmtT(e.time))}</span>${nonceCell(e)}`
    + `<span class="what">${rowSummary(e)}</span><span class="count" title="${n} event${n === 1 ? "" : "s"}"><span class="sr-only">, events: </span>${n}</span></button>`;
  if (!open) return { key: `r${e.key}`, cls, inner: head };
  const items = e.events.map((ev, i) => {
    const rej = rejectionOf(ev) != null;
    const parts = eventParts(ev, (kind, id) => idlink(kind, id, `#${id}`, `t${e.key}e${i}`));
    return `<li><span class="ev${rej ? " rej" : ""}">${esc(evName(ev))}</span>${parts.length ? `<span${rej ? ' class="ev rej"' : ""}>${parts.join(", ")}</span>` : ""}${audBadge(ev)}</li>`;
  }).join("") + e.balances.map(balanceLine).join("");
  return { key: `r${e.key}`, cls, inner: `${head}<ul class="row-events" id="row-ev-${esc(e.key)}">${items || '<li class="muted">No events.</li>'}</ul>` };
}

function patchList(box, items) {
  const old = new Map([...box.children].map((node) => [node.dataset.k, node]));
  const make = (it) => {
    const node = document.createElement("div");
    node.dataset.k = it.key;
    node.innerHTML = it.inner;
    node.patched = it.inner;
    if (it.hidden) node.setAttribute("aria-hidden", "true");
    return node;
  };
  let at = box.firstElementChild;
  for (const it of items) {
    let node = old.get(it.key);
    old.delete(it.key);
    if (!node) node = make(it);
    else if (node.patched !== it.inner) {
      const fresh = make(it);
      if (node === at) at = fresh;
      node.replaceWith(fresh);
      node = fresh;
    }
    if (node.className !== it.cls) node.className = it.cls;
    if (node === at) at = at.nextElementSibling;
    else box.insertBefore(node, at);
  }
  for (const node of old.values()) node.remove();
}

function renderTrace() {
  const sub = isAdmin() ? "Every batch, every event (admin)" : `What the gateway sent ${viewLabel(page.view)}`;
  setHtml(document.getElementById("trace-head"), `<div class="trace-head-top"><h2 id="trace-h">Trace</h2><span class="muted" style="font-size:13px">${esc(sub)}</span></div>
      <div class="filters" role="group" aria-label="Filter the trace">${FILTERS.map(([f, label]) =>
        `<button type="button" id="filter-${f}" data-action="filter" data-filter="${f}" aria-pressed="${ui.filter === f}">${label}</button>`).join("")}</div>`);
  const trace = V.M.trace;
  const last = trace.at(-1);
  const all = trace.filter(passesFilter);
  const rows = all.slice(-TRACE_ROWS).map((e) => {
    const open = ui.rows.get(e.key) ?? (isRejected(e) || e.kind === "resume" || e === last);
    return traceRow(e, e === last, open);
  });
  const cols = { key: "cols", cls: "log-cols", hidden: true, inner: "<span>seq</span><span>time</span><span>nonce</span><span>command</span><span>events</span>" };
  const how = isAdmin() ? ": pick one run in the timeline to see all of its rows" : "";
  const more = all.length > TRACE_ROWS ? [{ key: "more", cls: "trace-more", inner: `${all.length - TRACE_ROWS} earlier rows not shown${how}.` }] : [];
  const none = { rejections: "No rejections up to here.", money: "No balance moved up to here.", clock: "No Tick or Resume up to here." }[ui.filter] ?? "No batches up to here.";
  const empty = { key: "empty", cls: "empty", inner: `<p style="padding:10px 16px">${none}</p>` };
  patchList(document.getElementById("log"), [cols, ...more, ...rows, ...(rows.length ? [] : [empty])]);
}

function followLog() {
  const log = document.getElementById("log");
  if (ui.logPinned) log.scrollTop = log.scrollHeight;
}

const REF_FIELDS = ["request", "quote", "contract", "old", "new", "id"];
const REF_KIND = { request: "request", quote: "quote", old: "quote", new: "quote", contract: "contract" };
const KIND_TITLE = { request: "Request", quote: "Quote", contract: "Contract" };

function refers(v, id) {
  if (Array.isArray(v)) return v.some((x) => refers(x, id));
  if (!v || typeof v !== "object") return false;
  return Object.entries(v).some(([k, x]) => (REF_FIELDS.includes(k) && x === id) || refers(x, id));
}

function historyOf(sel) {
  if (!sel) return [];
  return V.M.trace.filter((e) => refers(e.command, sel.id) || e.events.some((ev) => refers(ev.event, sel.id)));
}

function currentState(sel) {
  if (sel.kind === "request") {
    const r = V.M.requests.find((x) => x.id === sel.id);
    return r ? variant(r.state) : null;
  }
  if (sel.kind === "quote") return V.M.quotes.find((q) => q.id === sel.id)?.state ?? null;
  const c = V.M.contracts.find((x) => x.id === sel.id);
  return c ? variant(c.state) : null;
}

function inspectorFacts(sel) {
  const where = "insp";
  const sealed = sealedMark("sealed");
  if (sel.kind === "request") {
    const r = V.M.requests.find((x) => x.id === sel.id);
    if (!r) return { badge: "", facts: "<span>Not in these batches.</span>" };
    const facts = [`<span>Requester ${r.requester != null ? `<b>${esc(name(r.requester))}</b>` : sealed}</span>`];
    for (const leg of r.legs) {
      if (!leg) continue;
      facts.push(`<span>Buy <b>${sideName(leg.side)}</b> × <b>${esc(qty(leg.qty))}</b> on ${idlink("contract", leg.contract, `#${leg.contract}`, where)}</span>`);
      facts.push(`<span>Limit ${leg.limit_price != null ? `<b>${fmtPrice(leg.limit_price)}</b>` : sealed}</span>`);
    }
    facts.push(`<span>Quotes due <b>${esc(fmtT(r.response_deadline))}</b></span>`);
    if (r.state?.Presented) facts.push(`<span>Accept by <b>${esc(fmtT(r.state.Presented.accept_by))}</b></span>`);
    for (const p of r.picks) facts.push(`<span>Pick ${idlink("quote", p.quote, `#${p.quote}`, where)} at <b>${fmtPrice(p.price)}</b></span>`);
    if (r.state?.Rejected) facts.push(`<span>Cause <b>${esc(r.state.Rejected)}</b></span>`);
    return { badge: badge(variant(r.state)), facts: facts.join("") };
  }
  if (sel.kind === "quote") {
    const q = V.M.quotes.find((x) => x.id === sel.id);
    if (!q) return { badge: "", facts: sealedMark("sealed: only its market maker and admin see this quote") };
    return {
      badge: badge(q.state),
      facts: `<span>Market maker <b>${esc(name(q.mm))}</b></span><span>On ${idlink("request", q.request, `request #${q.request}`, where)}</span>`
        + `<span>Sells at <b>${fmtPrice(q.price)}</b> × <b>${esc(qty(q.size))}</b></span><span>${q.state === "Selected" ? "Firm until" : "Expires"} <b>${esc(fmtT(q.expires_at))}</b></span>`,
    };
  }
  const c = V.M.contracts.find((x) => x.id === sel.id);
  if (!c) return { badge: "", facts: "<span>Not in these batches.</span>" };
  const st = variant(c.state);
  const facts = c.trading_close != null
    ? [`<span>Trading closes <b>${esc(fmtT(c.trading_close))}</b></span>`, `<span>Hard deadline <b>${esc(fmtT(c.resolution_deadline))}</b></span>`]
    : [sealedMark("terms not sent to this view")];
  if (st === "Proposed") facts.push(`<span>Proposed <b>${esc(outcomeName(c.state.Proposed.outcome))}</b>, dispute until <b>${esc(fmtT(c.state.Proposed.dispute_until))}</b></span>`);
  if (st === "Disputed") facts.push(`<span>Proposed <b>${esc(outcomeName(c.state.Disputed.proposed))}</b>, disputed by <b>${esc(name(c.dispute?.disputer))}</b></span>`);
  if (st === "Final") facts.push(`<span>Outcome <b>${esc(outcomeName(c.state.Final))}</b></span>`);
  return { badge: badge(st), facts: facts.join("") };
}

function historyItem(e, sel) {
  const user = e.command?.User;
  const who = user ? name(user.actor) : e.kind === "hidden" ? (e.events[0] ? audienceText(e.events[0]) : "hidden") : e.actor != null ? name(e.actor) : "system";
  const what = user ? variant(user.action) : e.kind === "hidden" || e.kind === "user" ? "" : e.kind;
  const ref = (field, id) => (id === sel.id ? `#${esc(id)}` : idlink(REF_KIND[field], id, `#${id}`, `insp${e.key}`));
  const evs = e.events.map((ev) => {
    const d = evData(ev), v = evName(ev);
    if (v === "QuoteReplaced") return `${esc(v)} ${ref("old", d.old)} → ${ref("new", d.new)}`;
    const field = ["quote", "request", "contract"].find((f) => typeof d[f] === "number");
    return `<span${rejectionOf(ev) ? ' class="check-bad"' : ""}>${esc(v)}${field ? ` ${ref(field, d[field])}` : ""}${rejectionOf(ev) ? ` (${esc(rejectionOf(ev))})` : ""}</span>`;
  }).join(", ");
  return `<li><button class="idlink" type="button" data-action="reveal-row" data-row="${esc(e.key)}" data-key="insp-seq-${esc(e.key)}">seq ${e.seq}</button> <b>${esc(who)}</b>${what ? ` ${esc(what)}` : ""}${evs ? ` → ${evs}` : ""}</li>`;
}

function renderInspector() {
  const el = document.getElementById("inspector");
  if (!selected) {
    setHtml(el, '<h2 id="insp-h" tabindex="-1">Inspector</h2><p class="empty">Click any request, quote or contract id to trace it up to this position.</p>');
    return;
  }
  const { badge: b, facts } = inspectorFacts(selected);
  const items = historyOf(selected).map((e) => historyItem(e, selected)).join("");
  setHtml(el, `<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
      <h2 id="insp-h" tabindex="-1">${KIND_TITLE[selected.kind] ?? "Object"} #${esc(selected.id)}</h2>
      <span style="display:flex;gap:8px;align-items:center">${b}<button class="btn btn-quiet btn-sm" type="button" id="insp-clear" data-action="deselect">Clear</button></span>
    </div>
    <div class="item-facts">${facts}</div>
    ${items ? `<ol>${items}</ol>` : `<p class="empty">Nothing in these batches mentions it.</p>`}`);
}

function revealRow(key) {
  ui.rows.set(key, true);
  const e = V.M.trace.find((x) => x.key === key);
  if (e && !passesFilter(e)) ui.filter = "all";
  ui.logPinned = false;
  render();
  const row = document.querySelector(`[data-key="row-${CSS.escape(key)}"]`);
  row?.scrollIntoView({ block: "nearest" });
  row?.focus({ preventScroll: true });
}

const REQUEST_STEPS = {
  RequestOpened: ["start", "Open"], RequestCancelled: ["cancel", "Cancelled"], RequestExpired: ["expire", "Expired"],
  RequestPresented: ["present", "Presented"], RequestFilled: ["accept", "Filled"], RequestRejected: ["reject", "Rejected"],
};
const QUOTE_STEPS = {
  QuoteSubmitted: ["start", "Active"], QuoteReplaced: ["replace", "Replaced"], QuoteCancelled: ["cancel", "Cancelled"],
  QuoteExpired: ["expire", "Expired"], QuoteLost: ["lose", "Lost"], QuoteSelected: ["select", "Selected"],
  QuoteFilled: ["fill", "Filled"], QuoteReleased: ["release", "Released"],
};

function contractStep(v, at, entry) {
  switch (v) {
    case "ContractListed": return ["start", "Trading"];
    case "ContractClosed": return ["close", "Closed"];
    case "OutcomeProposed": return entry.kind === "resume" || at === "Proposed" ? ["resume", "Proposed"] : ["propose", "Proposed"];
    case "Disputed": return ["dispute", "Disputed"];
    case "Ruled": return ["rule", "FinalB"];
    case "ContractFinalized":
      if (at === "Proposed") return ["window", "FinalA"];
      if (at === "Disputed") return ["hardDisputed", "FinalB"];
      if (at === "Closed") return ["hardClosed", "FinalA"];
      return null;
    default: return null;
  }
}

function transitionsOf(sel) {
  const out = [];
  let at = null;
  for (const e of historyOf(sel)) {
    for (const ev of e.events) {
      const v = evName(ev), d = evData(ev);
      let step = null;
      if (sel.kind === "request" && d.request === sel.id) step = REQUEST_STEPS[v];
      else if (sel.kind === "quote" && (v === "QuoteReplaced" ? d.old : d.quote) === sel.id) step = QUOTE_STEPS[v];
      else if (sel.kind === "contract" && d.contract === sel.id) step = contractStep(v, at, e);
      if (step) {
        out.push({ edge: step[0], to: step[1], seq: e.seq });
        at = step[1];
      }
    }
  }
  return out;
}

/**
 * The object each diagram lights: the one the presenter clicked, else the run's own from the model
 * (its newest request, that request's picked quote or its newest quote, its contract).
 */
function litObject(kind) {
  if (selected?.kind === kind) return selected;
  const M = V.M;
  if (kind === "request") {
    const r = M.requests.at(-1);
    return r ? { kind, id: r.id, auto: true } : null;
  }
  if (kind === "quote") {
    const r = selected?.kind === "request" ? M.requests.find((x) => x.id === selected.id) : M.requests.at(-1);
    const picked = r?.picks?.[0]?.quote ?? r?.legs?.[0]?.selected;
    const q = M.quotes.find((x) => x.id === picked) ?? M.quotes.at(-1);
    return q ? { kind, id: q.id, auto: true } : null;
  }
  const c = M.contracts.at(-1);
  return c ? { kind, id: c.id, auto: true } : null;
}

function litFor(sel) {
  if (!sel) return null;
  const now = currentState(sel);
  const last = transitionsOf(sel).at(-1);
  const node = (key) => (key === "FinalA" || key === "FinalB" ? "Final" : key);
  const edge = last && now && node(last.to) === now ? last.edge : null;
  let nodes = [];
  if (now === "Final") nodes = edge ? [last.to] : ["FinalA", "FinalB"];
  else if (now) nodes = [now];
  return { now, nodes: new Set(nodes), edge };
}

function machineHtml(m) {
  const sel = litObject(m.kind);
  const lit = litFor(sel);
  const p = `sm-${m.kind}`;
  const labelOf = (key) => m.edges.find(([k]) => k === key)?.[2].map((l) => l[2]).join(" ") ?? "";
  const edges = m.edges.map(([key, d]) => `<path class="sm-edge${lit?.edge === key ? " is-last" : ""}" d="${d}" marker-end="url(#${p}-ah${lit?.edge === key ? "-last" : ""})"/>`).join("");
  const labels = m.edges.flatMap(([key, , ls]) => ls.map(([x, y, t, anchor]) =>
    `<text class="sm-label${lit?.edge === key ? " is-last" : ""}" x="${x}" y="${y}"${anchor ? ` text-anchor="${anchor}"` : ""}>${esc(t)}</text>`)).join("");
  const nodes = m.nodes.map(([key, x, y, w, t, terminal]) => {
    const cls = ["sm-node", terminal && "is-terminal", lit?.nodes.has(key) && "is-current"].filter(Boolean).join(" ");
    return `<g class="${cls}" data-node="${key}"><rect x="${x}" y="${y}" width="${w}" height="32" rx="6"/><text x="${x + w / 2}" y="${y + 21}" text-anchor="middle">${esc(t)}</text></g>`;
  }).join("");
  const marker = (id, fill, size) => `<marker id="${id}" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="${size}" markerHeight="${size}" orient="auto"><path d="M0 0L8 4L0 8z" style="fill:var(${fill})"/></marker>`;
  const who = sel?.auto ? "this run's" : "selected";
  const status = !sel ? `no ${m.kind} up to this position`
    : lit.now ? `${who} #${sel.id} is ${lit.now}` : `#${sel.id}: its state is not in this view`;
  const aria = [`${m.title} state machine.`];
  if (sel) aria.push(lit.now ? `#${sel.id} is ${lit.now}${lit.edge ? `, entered by ${labelOf(lit.edge)}` : ""}.` : `#${sel.id}'s state is not in this view.`);
  return `<div class="machine" id="machine-${m.kind}" data-lit="${esc(lit?.now ?? "")}">
      <h3>${m.title} <span class="muted" style="font-weight:400;font-size:13px">${esc(status)}</span></h3>
      <svg viewBox="${m.view}" role="img" aria-label="${esc(aria.join(" "))}"><defs>${marker(`${p}-ah`, "--ink-3", 7)}${marker(`${p}-ah-last`, "--accent", 6)}</defs>
        <circle class="sm-start" cx="${m.start[0]}" cy="${m.start[1]}" r="5"/>${edges}${labels}${nodes}</svg>
      <p class="muted caption">${esc(m.caption)}</p>
    </div>`;
}

function multiLegPanel() {
  return `<p style="margin-bottom:10px"><span class="not-built">Designed, not built (P6)</span> <span class="muted">The engine rejects more than one leg today: a request with two or more legs is CommandRejected (Unsupported). This is the design for "leg 2 of 3 fails after leg 1 matched".</span></p>
    <div class="steps3">
      <div class="item"><div class="item-head"><span class="id">1. Before the deadline</span></div><p style="font-size:13px">Leg 1: MM-A's quote is Active and holds. Leg 2: no quote. Leg 3: MM-C's quote is Active and holds. The request is Open. Nothing provisional is escrowed.</p></div>
      <div class="item"><div class="item-head"><span class="id">2. The deadline fires</span></div><p style="font-size:13px">Leg 2 has no eligible quote, so the whole request is Expired. MM-A's, MM-C's and the requester's holds are all released in that one command.</p></div>
      <div class="item"><div class="item-head"><span class="id">3. Alternative path</span></div><p style="font-size:13px">Every leg has an eligible quote and the request is Presented. MM-B's cancel on leg 2 is rejected (InvalidState) because selected quotes are firm. Accept fills all three legs in one command; Reject or a lapse releases all of them.</p></div>
    </div>
    <ol class="rules">
      <li>One hold per request covers all legs, and one hold per quote: no per-leg partial commitment.</li>
      <li>Selection is all-or-nothing: every leg needs an eligible quote, or the request expires and every hold is released.</li>
      <li>Acceptance is one command: all legs are validated first, then all escrows applied.</li>
      <li>A presented request stays whole: selected quotes are firm, so no leg drops out inside the window.</li>
      <li>Every leg's contract outlives the request: the trading-close guard runs per leg.</li>
    </ol>`;
}

/** A button that runs a scenario live; "Related" when it only shows the situation around the row. */
function runButton(scenario, where, related = false) {
  const s = RfqScenarios.byName(scenario);
  if (!s) return null;
  const label = related ? "Related" : "Run";
  const title = `${related ? "Related, not the race itself. " : ""}Run ${s.name} live${isAdmin() ? `: ${s.summary}` : ""}`;
  return `<button class="btn btn-sm" type="button" data-action="run-scenario" data-scenario="${esc(s.name)}" data-key="run-${esc(where)}" title="${esc(title)}"${disabledIf(page.set != null || page.conn !== "connected", "A run is in progress, or the gateway is not connected")}>${label}<span class="sr-only"> ${esc(s.name)}</span></button>`;
}
const runCell = (scenario, where, fallback, related) =>
  `<td class="run">${runButton(scenario, where, related) ?? `<span class="muted">${fallback}</span>`}</td>`;

// ---- Runs: start, stop ------------------------------------------------------------------------------

function readWhole(id, lo, hi, what) {
  const t = document.getElementById(id).value.trim();
  const n = /^\d+$/.test(t) ? Number(t) : NaN;
  if (!(n >= lo && n <= hi)) throw new Error(`${what}: enter a whole number from ${lo} to ${hi}.`);
  return n;
}

async function startRuns(kind, scenario) {
  if (page.set) return;
  const err = document.getElementById("runctl-err");
  const picked = scenario ?? document.getElementById("scenario-pick").value;
  let n = 1, k = 1;
  try {
    if (kind === "n") n = readWhole("run-n-count", 1, MAX_N, "N");
    if (kind !== "one") k = readWhole("run-k", 1, MAX_K, "Runs at a time");
  } catch (e) {
    err.textContent = e.message;
    return;
  }
  err.textContent = "";
  const names = kind === "all" ? RfqScenarios.names() : [picked];
  const label = kind === "one" ? picked : kind === "n" ? `${picked} ×${n}` : `Run all (${names.length})`;
  page.set = { label, kind, total: names.length * n, k, started: Date.now(), finished: null, runs: [], stopping: false, hidden: document.hidden };
  if (ui.sel !== "all") ui.sel = "follow";
  ui.pos = null;
  render();
  try {
    if (kind === "one") await driver.run(picked);
    else await driver.runMany(names, n, k);
  } catch (e) {
    // Stopped while it waited for the engine: nothing ran, nothing to report.
    if (e?.name !== "Stopped") addError(`${label}: ${e.message}`);
  }
  const set = page.set;
  set.finished = Date.now();
  set.stopped = set.stopping;
  page.lastSet = set;
  page.set = null;
  schedule();
}

function stopRuns() {
  if (!page.set) return;
  page.set.stopping = true;
  driver.stop();
  schedule();
}

function toggleTheme() {
  const shown = root.dataset.theme ?? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  root.dataset.theme = shown === "dark" ? "light" : "dark";
  try { localStorage.setItem("rfq-dashboard-theme", root.dataset.theme); } catch { /* storage blocked */ }
}

function moveTo(pos) {
  if (!V?.n) return;
  ui.pos = Math.max(0, Math.min(V.n - 1, pos));
  render();
}

// ---- Events: one delegated listener per kind ---------------------------------------------------------

app.addEventListener("click", (e) => {
  const b = e.target.closest("[data-action]");
  if (!b || b.disabled || !app.contains(b)) return;
  const d = b.dataset;
  switch (d.action) {
    case "theme": return toggleTheme();
    case "dismiss-error": page.errors.splice(Number(d.index), 1); return render();
    case "run-one": return startRuns("one");
    case "run-n": return startRuns("n");
    case "run-all": return startRuns("all");
    case "run-scenario":
      document.getElementById("scenario-pick").value = d.scenario;
      return startRuns("one", d.scenario);
    case "stop": return stopRuns();
    case "view": return setView(d.view);
    case "select": selected = { kind: d.kind, id: Number(d.id) }; return render();
    case "deselect":
      selected = null;
      render();
      return document.getElementById("insp-h")?.focus();
    case "toggle-row": ui.rows.set(d.row, b.getAttribute("aria-expanded") !== "true"); return render();
    case "reveal-row": return revealRow(d.row);
    case "filter": ui.filter = d.filter; ui.logPinned = true; return render();
    case "tab": ui.tab = d.tab; return render();
    case "pick-run": ui.sel = d.run; ui.pos = null; return render();
    case "step-back": return moveTo((V?.pos ?? 0) - 1);
    case "step-fwd": return moveTo((V?.pos ?? 0) + 1);
    case "live": ui.pos = null; ui.logPinned = true; return render();
    case "copy": return copyCommand(d.target, d.key);
    default:
  }
});

app.addEventListener("input", (e) => {
  if (e.target.id === "tl-range") moveTo(Number(e.target.value));
});

app.addEventListener("change", (e) => {
  if (e.target.id === "tl-run") {
    if (!isAdmin()) return;
    ui.sel = e.target.value;
    ui.pos = null;
    render();
  } else if (e.target.id === "scenario-pick") render();
});

app.addEventListener("keydown", (e) => {
  const tab = e.target.closest?.('[role="tab"]');
  if (tab) {
    const keys = TABS.map(([k]) => k);
    const i = keys.indexOf(tab.dataset.tab);
    const to = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: keys.length - 1 }[e.key];
    if (to == null) return;
    e.preventDefault();
    ui.tab = keys[(to + keys.length) % keys.length];
    render();
    document.getElementById(`tab-${ui.tab}`)?.focus();
    return;
  }
  // Enter in N runs ×N; Enter in the concurrency field starts nothing (it belongs to Run ×N and Run all alike).
  if (e.key === "Enter" && e.target.id === "run-n-count") startRuns("n");
});

// The timeline's arrow keys, anywhere a control doesn't use them itself.
document.addEventListener("keydown", (e) => {
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const t = e.target;
  if (t.closest?.("input, select, textarea, [role=tab], [contenteditable]")) return;
  e.preventDefault();
  moveTo((V?.pos ?? 0) + (e.key === "ArrowLeft" ? -1 : 1));
});

const topbar = document.getElementById("topbar");
const syncTopbar = () => root.style.setProperty("--topbar-h", `${topbar.offsetHeight}px`);
if (typeof ResizeObserver === "function") new ResizeObserver(syncTopbar).observe(topbar);
syncTopbar();

document.getElementById("log").addEventListener("scroll", (e) => {
  const log = e.currentTarget;
  ui.logPinned = log.scrollHeight - log.scrollTop - log.clientHeight < 24;
}, { passive: true });

// Browsers slow a background tab's timers: the driver's schedule would slip.
document.addEventListener("visibilitychange", () => {
  if (document.hidden && page.set) page.set.hidden = true;
  updateTitle();
  schedule();
});

// A page kept in the back/forward cache comes back: keep the driver (the client reconnects by itself).
addEventListener("pagehide", (e) => {
  if (e.persisted) return;
  driver.dispose();
  closeViewConn();
  gw.close();
});

try { const t = localStorage.getItem("rfq-dashboard-theme"); if (t === "dark" || t === "light") root.dataset.theme = t; } catch { /* storage blocked */ }
if (location.hash.includes("dark")) root.dataset.theme = "dark";
render();
</script>
</body>
