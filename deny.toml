[graph]
# The `aeron` features are off by default but are part of the shipped binary (docker/rust.Dockerfile),
# so audit them too: rusteron and its build-time deps (bindgen, cmake, ...) are in Cargo.lock.
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 is flagged unmaintained (its authors stopped work and call 1.3.3 complete), not vulnerable. No upgrade exists. It is the wire codec in rfq-infra (fixint, little-endian, trailing bytes rejected, 64 KiB cap at untrusted ingress) and the canonical encoding behind Engine::state_hash. Swapping it means a new codec version byte; revisit then." },
]

[licenses]
version = 2
# Permissive licences only. Dual-licensed crates pass if any one option is allowed, e.g. dunce
# (CC0-1.0 OR MIT-0 OR Apache-2.0) and aho-corasick (Unlicense OR MIT) are covered by Apache-2.0 and MIT.
# The aeron build-time tree adds BSD-3-Clause (bindgen) and ISC (libloading), both already listed.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
# The list is the policy, not an inventory of what the lockfile happens to use today.
unused-allowed-license = "allow"

# The allow list is the policy for third-party crates. This workspace's own crates (all
# `publish = false`) are MPL-2.0, see LICENSE and COPYRIGHT, and are not checked against it.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
