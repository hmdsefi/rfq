# The RFQ engine on Aeron, end to end. Run it all with ./scripts/demo.sh.
#
#   aeron   the Java ArchivingMediaDriver: media driver + Archive (the engine's journal)
#   engine  rfq-node: sequencer + engine, journaling to the Archive
#   demo    rfq-demo: runs the scripted scenarios as an Aeron client (profile `demo`, run on demand:
#           `docker compose run --rm demo [scenario]`)
#
# Every stream is `aeron:ipc`, so the containers share the driver's IPC namespace (`/dev/shm/aeron`),
# not a network. See docs/specs/transport-aeron.md.
name: rfq

services:
  aeron:
    build: docker/aeron
    ipc: shareable
    shm_size: 512m
    volumes: [archive:/data/archive]
    # If the driver process dies it comes back with its journal (the `archive` volume). The engine
    # then halts on the dead driver, and its own restart policy replays from the recovered Archive.
    restart: on-failure

  engine:
    build: { context: ., dockerfile: docker/rust.Dockerfile, args: { BIN: rfq-node } }
    ipc: "service:aeron"
    # An init process as PID 1, so SIGTERM stops the node at once (`docker compose stop`).
    init: true
    # A halted node (any port failure, see `Node::poll`) exits with status 1. This brings it back, and
    # it replays the journal. A journal it cannot replay fails every start, so the restarts repeat
    # (with Docker's growing back-off) until someone reads the log. `docker compose kill` counts as
    # a manual stop that the policy ignores, so scripts/demo.sh's SIGKILL and its own `start` do not
    # race with a restart.
    restart: on-failure
    environment:
      RFQ_JOURNAL: archive
      # Logs `applied seq=<n> hash=<state hash>` after every batch: scripts/demo.sh compares the
      # last one before a crash with the `replayed seq=<n> hash=<state hash>` after the restart.
      RFQ_HASH_EVERY_BATCH: "1"
    depends_on: [aeron]

  demo:
    build: { context: ., dockerfile: docker/rust.Dockerfile, args: { BIN: rfq-demo } }
    ipc: "service:aeron"
    init: true
    depends_on: [engine]
    profiles: [demo]

volumes:
  archive: {}
