# The RFQ engine on Aeron, end to end. Run it all with ./scripts/demo.sh.
#
#   aeron   the Java ArchivingMediaDriver: media driver + Archive (the engine's journal)
#   engine  rfq-node: sequencer + engine, journaling to the Archive
#   gateway rfq-gateway: the WebSocket client edge on ws://127.0.0.1:18080 (docs/specs/gateway.md)
#           and the HTTP API on http://127.0.0.1:18081 (docs/specs/read-api.md)
#   demo    rfq-demo: runs the scripted scenarios as an Aeron client (profile `demo`, run on demand:
#           `docker compose run --rm demo [scenario]`)
#
# Every stream is `aeron:ipc`, so the containers share the driver's IPC namespace (`/dev/shm/aeron`),
# not a network. See docs/specs/transport-aeron.md.
name: rfq

services:
  aeron:
    build: docker/aeron
    ipc: shareable
    shm_size: 512m
    volumes: [archive:/data/archive]
    # A driver that exits by itself (`docker compose exec aeron kill -TERM 1`, exit 143) is restarted
    # in about 1 s with its journal (the `archive` volume); the engine and gateway exit 1 on the dead
    # driver, their own policies bring them back, and the engine replays. A manual stop (`docker
    # compose kill aeron`) is not restarted, and the engine and gateway then cannot rejoin its dead IPC
    # namespace: `docker compose up -d aeron engine gateway` brings all three back, and the engine
    # replays to the same hash. A hard JVM crash does not heal by itself either (architecture §5).
    # Retries are capped at 3: a driver that keeps failing (a root-owned `archive` volume, say) stays
    # down, and `docker compose logs aeron` shows why.
    restart: "on-failure:3"

  engine:
    build: { context: ., dockerfile: docker/rust.Dockerfile, args: { BIN: rfq-node } }
    ipc: "service:aeron"
    # An init process as PID 1, so SIGTERM stops the node at once (`docker compose stop`).
    init: true
    # A halted node (any port failure, see `Node::poll`) exits with status 1. This brings it back, and
    # it replays the journal. Retries are capped at 3: a journal it cannot replay fails every start,
    # so after the third retry the container stays down, and `docker compose logs engine` shows why.
    # `docker compose kill` counts as a manual stop that the policy ignores, so scripts/demo.sh's
    # SIGKILL and its own `start` do not race with a restart.
    restart: "on-failure:3"
    environment:
      RFQ_JOURNAL: archive
      # Logs `applied seq=<n> hash=<state hash>` after every batch: scripts/demo.sh compares the
      # last one before a crash with the `replayed seq=<n> hash=<state hash>` after the restart.
      RFQ_HASH_EVERY_BATCH: "1"
    depends_on: [aeron]

  gateway:
    build: { context: ., dockerfile: docker/rust.Dockerfile, args: { BIN: rfq-gateway } }
    ipc: "service:aeron"
    init: true
    # A dead engine is not fatal for the gateway (its clients see `status down`); a dead media
    # driver or Aeron client is: it exits with status 1, and this brings it back. Capped like the
    # others, so a gateway that keeps failing stays down and `docker compose logs gateway` says why.
    restart: "on-failure:3"
    environment:
      # 0.0.0.0 inside the container, so the port mappings reach it; on the host they are published
      # on 127.0.0.1 only (gateway.md §7, read-api.md §9).
      RFQ_GATEWAY_ADDR: "0.0.0.0:18080"
      RFQ_HTTP_ADDR: "0.0.0.0:18081"
      # One level for everything; `RUST_LOG=debug docker compose up -d gateway` also shows nonce
      # and liveness probes.
      RUST_LOG: "${RUST_LOG:-info}"
    # Host ports 18080 (WebSocket) and 18081 (HTTP) unless RFQ_GATEWAY_PORT and RFQ_HTTP_PORT say
    # otherwise.
    ports:
      - "127.0.0.1:${RFQ_GATEWAY_PORT:-18080}:18080"
      - "127.0.0.1:${RFQ_HTTP_PORT:-18081}:18081"
    # It may start before the engine: its status is simply down until the engine is there.
    depends_on: [aeron]

  demo:
    build: { context: ., dockerfile: docker/rust.Dockerfile, args: { BIN: rfq-demo } }
    ipc: "service:aeron"
    init: true
    depends_on: [engine]
    profiles: [demo]

volumes:
  archive: {}
